<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل الدخول — 1SaudiCyber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="../assets/js/app.js"></script>
</head>
<body class="font-arabic text-sc-ink bg-sc-soft min-h-screen flex flex-col">

<!-- Topbar -->
<header class="bg-white border-b border-sc-line">
  <div class="max-w-[1420px] mx-auto px-8 h-16 flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2">
      <img src="../assets/images/logo.png" alt="1SaudiCyber" class="h-9 w-auto">
    </a>
    <div class="flex items-center gap-3">
      <button class="flex items-center gap-1 text-sm text-sc-muted border border-sc-line rounded-lg px-3 py-1.5 hover:bg-sc-soft transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        العربية
        <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="text-sm text-sc-muted">ليس لديك حساب؟</span>
      <a href="register.html" class="btn btn-primary btn-sm">إنشاء حساب</a>
    </div>
  </div>
</header>

<!-- Main -->
<main class="flex-1 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md" x-data="{email:'',password:'',showPass:false,loading:false,submit(){this.loading=true;setTimeout(()=>{window.location.href='company/dashboard.html'},800)}}">

    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-sc-green/10 text-sc-green flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0 1 12 2.944a11.955 11.955 0 0 1-8.618 3.04A12.02 12.02 0 0 0 3 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h1 class="text-2xl font-bold mb-1">تسجيل الدخول</h1>
      <p class="text-sm text-sc-muted">أدخل بيانات حسابك للمتابعة</p>
    </div>

    <div class="card p-8">
      <form @submit.prevent="submit" class="space-y-5">
        <div>
          <label class="field-label">البريد الإلكتروني</label>
          <div class="relative">
            <input x-model="email" type="email" placeholder="example@company.com" class="field pl-10" required>
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-sc-muted" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 0 0 2.22 0L21 8M5 19h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"/></svg>
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="field-label mb-0">كلمة المرور</label>
            <a href="#" class="text-xs text-sc-green hover:underline">نسيت كلمة المرور؟</a>
          </div>
          <div class="relative">
            <input x-model="password" :type="showPass ? 'text' : 'password'" placeholder="••••••••" class="field pl-10" required>
            <button type="button" @click="showPass=!showPass" class="absolute left-3 top-1/2 -translate-y-1/2 text-sc-muted hover:text-sc-ink">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path x-show="!showPass" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path x-show="!showPass" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                <path x-show="showPass" d="M13.875 18.825A10.05 10.05 0 0 1 12 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 0 1 4.021-5.93M9.878 9.878a3 3 0 0 0 4.243 4.243M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3.5 text-base" :disabled="loading">
          <span x-show="!loading">تسجيل الدخول</span>
          <span x-show="loading" class="flex items-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/></svg>
            جارٍ التحقق...
          </span>
        </button>
      </form>

      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-sc-line"></div></div>
        <div class="relative flex justify-center text-xs text-sc-muted bg-white px-3">أو تسجيل الدخول باستخدام</div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <button class="flex items-center justify-center gap-2 border border-sc-line rounded-lg py-2.5 text-sm hover:bg-sc-soft transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="flex items-center justify-center gap-2 border border-sc-line rounded-lg py-2.5 text-sm hover:bg-sc-soft transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#00A4EF" d="M0 0h11.377v11.372H0z"/><path fill="#FFB900" d="M12.623 0H24v11.372H12.623z"/><path fill="#00B4F0" d="M0 12.623h11.377V24H0z"/><path fill="#FFB900" d="M12.623 12.623H24V24H12.623z"/></svg>
          Microsoft
        </button>
        <button class="flex items-center justify-center gap-2 border border-sc-line rounded-lg py-2.5 text-sm hover:bg-sc-soft transition">
          <svg class="w-4 h-4 text-sc-green" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0 1 12 2.944a11.955 11.955 0 0 1-8.618 3.04A12.02 12.02 0 0 0 3 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          SSO
        </button>
      </div>
    </div>

  </div>
</main>

<!-- Footer -->
<footer class="border-t border-sc-line bg-white py-4">
  <div class="max-w-[1420px] mx-auto px-8 flex flex-wrap justify-between items-center gap-4 text-xs text-sc-muted">
    <div class="flex items-center gap-2">
      <img src="../assets/images/logo.png" alt="" class="h-6 w-auto opacity-70">
      <span>منصة الامتثال السيبراني</span>
    </div>
    <div class="flex gap-5">
      <a href="#" class="hover:text-sc-green transition">سياسة الخصوصية</a>
      <a href="#" class="hover:text-sc-green transition">شروط الاستخدام</a>
      <a href="#" class="hover:text-sc-green transition">الدعم والمساعدة</a>
    </div>
    <span>© 2026 1SaudiCyber. تطوير شركة احصل الحل — <a href="https://gscompany.sa" class="text-sc-green hover:underline">gscompany.sa</a></span>
  </div>
</footer>

</body>
</html>

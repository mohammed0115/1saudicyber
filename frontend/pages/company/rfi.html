<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>طلبات المعلومات (RFI) — 1SaudiCyber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="../../assets/js/app.js"></script>
</head>
<body class="font-arabic text-sc-ink bg-sc-soft min-h-screen" x-data="rfiList">

<!-- Topbar -->
<header class="bg-white border-b border-sc-line sticky top-0 z-40">
  <div class="flex items-center justify-between px-5 h-14">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="flex items-center gap-2 text-sc-muted hover:text-sc-ink">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        العودة للوحة التحكم
      </a>
    </div>
    <a href="../../index.html"><img src="../../assets/images/logo.png" alt="1SaudiCyber" class="h-8 w-auto"></a>
    <div class="flex items-center gap-2 border border-sc-line rounded-lg px-3 py-1.5">
      <div class="w-7 h-7 rounded-full bg-sc-green text-white flex items-center justify-center text-xs font-bold">AH</div>
      <p class="text-xs font-semibold hidden sm:block">أحمد العتيبي</p>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto py-8 px-4">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-bold">طلبات المعلومات (RFI)</h1>
      <p class="text-sm text-sc-muted">طلبات المعلومات الواردة من المدقق</p>
    </div>
    <div class="flex gap-2">
      <span class="badge-gold">1 مفتوح</span>
      <span class="badge-green">1 مغلق</span>
    </div>
  </div>

  <!-- RFI list -->
  <div class="space-y-4" x-show="!activeRfi">
    <template x-for="rfi in rfis" :key="rfi.id">
      <div class="card p-5 hover:shadow-card-hover transition-shadow cursor-pointer"
        :class="rfi.status === 'open' ? 'border-sc-gold/40' : ''"
        @click="open(rfi)">
        <div class="flex items-start justify-between mb-3">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="font-bold" x-text="rfi.id"></span>
              <span :class="rfi.status === 'open' ? 'badge-gold' : 'badge-green'"
                x-text="rfi.status === 'open' ? 'مفتوح' : 'مغلق'"></span>
            </div>
            <p class="text-sm text-sc-muted" x-text="rfi.control"></p>
          </div>
          <div class="text-left">
            <p class="text-xs text-sc-muted" x-text="rfi.date"></p>
            <p class="text-xs text-sc-muted mt-0.5" x-text="rfi.auditor"></p>
          </div>
        </div>
        <p class="text-sm line-clamp-2" x-text="rfi.question"></p>
        <div class="mt-3 flex justify-between items-center">
          <span class="text-xs text-sc-green font-semibold" x-show="rfi.status === 'open'">انقر للرد على الطلب ←</span>
          <span class="text-xs text-sc-muted" x-show="rfi.status !== 'open'">تم الرد — انقر للعرض</span>
        </div>
      </div>
    </template>
  </div>

  <!-- RFI detail & response -->
  <div x-show="activeRfi" class="space-y-5">
    <button @click="close" class="flex items-center gap-2 text-sm text-sc-muted hover:text-sc-ink">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      العودة للقائمة
    </button>

    <!-- RFI card -->
    <div class="card p-6 border-sc-gold/30">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="font-bold text-lg" x-text="activeRfi?.id"></h2>
          <p class="text-sm text-sc-muted" x-text="activeRfi?.control"></p>
        </div>
        <span :class="activeRfi?.status === 'open' ? 'badge-gold' : 'badge-green'"
          x-text="activeRfi?.status === 'open' ? 'مفتوح' : 'مغلق'"></span>
      </div>
      <div class="bg-sc-soft rounded-xl p-4 mb-4">
        <p class="text-xs font-bold text-sc-muted mb-2">سؤال المدقق:</p>
        <p class="text-sm" x-text="activeRfi?.question"></p>
        <p class="text-xs text-sc-muted mt-2">المدقق: <span x-text="activeRfi?.auditor"></span> | التاريخ: <span x-text="activeRfi?.date"></span></p>
      </div>

      <!-- Response form -->
      <div x-show="activeRfi?.status === 'open'">
        <label class="field-label">ردك على الطلب</label>
        <textarea x-model="activeRfi.response" rows="4" class="field mb-4" placeholder="اكتب ردك هنا..."></textarea>

        <!-- File upload -->
        <div class="border-2 border-dashed border-sc-line rounded-xl p-5 text-center mb-4">
          <svg class="w-8 h-8 mx-auto mb-2 text-sc-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M7 16a4 4 0 0 1-.88-7.903A5 5 0 1 1 15.9 6L16 6a5 5 0 0 1 1 9.9M15 13l-3-3m0 0-3 3m3-3v12"/></svg>
          <p class="text-sm text-sc-muted mb-2">أرفق دليلًا إضافيًا (اختياري)</p>
          <label class="btn btn-ghost btn-sm cursor-pointer">
            <input type="file" class="hidden" multiple>
            اختر ملفات
          </label>
        </div>

        <div class="flex gap-3">
          <button @click="submit(activeRfi)" class="btn btn-primary btn-md flex-1">
            إرسال الرد
          </button>
          <button @click="close" class="btn btn-ghost btn-md">إلغاء</button>
        </div>
      </div>

      <!-- Closed response view -->
      <div x-show="activeRfi?.status !== 'open'" class="bg-sc-green/5 border border-sc-green/20 rounded-xl p-4">
        <p class="text-xs font-bold text-sc-green mb-2">الرد المُرسل:</p>
        <p class="text-sm" x-text="activeRfi?.response"></p>
        <div class="flex flex-wrap gap-2 mt-3">
          <template x-for="f in activeRfi?.files || []" :key="f">
            <div class="flex items-center gap-2 bg-white border border-sc-line rounded-lg px-3 py-1.5 text-xs">
              <svg class="w-3.5 h-3.5 text-sc-muted" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/></svg>
              <span x-text="f"></span>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>

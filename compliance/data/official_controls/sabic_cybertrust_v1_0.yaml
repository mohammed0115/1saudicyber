  external_reference: SABIC CT-20
  domain: GOVERN
  subdomain: Policies, Processes, and Procedures (GV.PO)
  title: The Supplier must conduct background check (screening/vetting) on Employees…
  statement: >-
    The Supplier must conduct background check (screening/vetting) on Employees viewing or/and processing
    SABIC’s confidential and strictly confidential
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, GOVERN / Policies, Processes, and Procedures (GV.PO) / CT-20
  tags: []
- control_id: CT-21
  external_reference: SABIC CT-21
  domain: IDENTIFY
  subdomain: Asset Management (ID.AM)
  title: The Supplier must follow an established Secure development Life Cycle (SDLC)…
  statement: >-
    The Supplier must follow an established Secure development Life Cycle (SDLC) for the Software and
    product development. The SDLC should comply with applicable best practice guidelines. SDLC should
    incorporate vendor-specific development best practices to ensure applications are built with the recommended
    security guidance from the vendor.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Asset Management (ID.AM) / CT-21
  tags: []
- control_id: CT-22
  external_reference: SABIC CT-22
  domain: IDENTIFY
  subdomain: Asset Management (ID.AM)
  title: Supplier must use Secure-by-design principles as part of security architectural…
  statement: >-
    Supplier must use Secure-by-design principles as part of security architectural designs for OT/ICS
    products. Secure-by-design principles include establish secure defaults, minimize attack surface area,
    fail securely, defense in depth, least privilege, separation of duties, keeping security simple and
    avoid security by obscurity.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Asset Management (ID.AM) / CT-22
  tags: []
- control_id: CT-23
  external_reference: SABIC CT-23
  domain: IDENTIFY
  subdomain: Asset Management (ID.AM)
  title: The Supplier must inventory all third-party software components (whether…
  statement: >-
    The Supplier must inventory all third-party software components (whether commercial, free, or open-source
    software) used in the Software development and provide such inventory to SABIC upon request. Supplier
    must assess whether any such components have any security defects or vulnerabilities that could lead
    to a Security Incident.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Asset Management (ID.AM) / CT-23
  tags: []
- control_id: CT-25
  external_reference: SABIC CT-25
  domain: IDENTIFY
  subdomain: Risk Assessment (ID.RA)
  title: The Supplier must perform a regular vulnerability scanning using trusted…
  statement: >-
    The Supplier must perform a regular vulnerability scanning using trusted vulnerability management
    technologies.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Risk Assessment (ID.RA) / CT-25
  tags: []
- control_id: CT-26
  external_reference: SABIC CT-26
  domain: IDENTIFY
  subdomain: Risk Assessment (ID.RA)
  title: The Supplier must conduct at least annual Penetration Testing on its IT…
  statement: >-
    The Supplier must conduct at least annual Penetration Testing on its IT infrastructure systems and
    internet facing applications by reputed external party.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Risk Assessment (ID.RA) / CT-26
  tags: []
- control_id: CT-27
  external_reference: SABIC CT-27
  domain: IDENTIFY
  subdomain: Improvement (ID.IM)
  title: The personnel with access to OT/ICS assets, besides the general cybersecurity…
  statement: >-
    The personnel with access to OT/ICS assets, besides the general cybersecurity training and awareness,
    must go through an OT/ICS cybersecurity awareness and training program. The program must include,
    at a minimum, the following: customized training, qualifications, knowledge, and professional skillsets
    related to the OT/ICS assets cybersecurity.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Improvement (ID.IM) / CT-27
  tags: []
- control_id: CT-28
  external_reference: SABIC CT-28
  domain: IDENTIFY
  subdomain: Improvement (ID.IM)
  title: The Supplier must have a process in place to guarantee that a non-disclosure…
  statement: >-
    The Supplier must have a process in place to guarantee that a non-disclosure agreement between contracted
    employees of the Supplier and the Supplier is signed before access to SABIC systems and/or premises
    is granted.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Improvement (ID.IM) / CT-28
  tags: []

- control_id: CT-49
  external_reference: SABIC CT-49
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: The Supplier must implement a sanitization process before any Assets are…
  statement: >-
    The Supplier must implement a sanitization process before any Assets are loaned, donated, destroyed,
    transferred, or surpluses. The process must be aligned to industry best practices such as NIST 800-88.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-49
  tags: []
- control_id: CT-50
  external_reference: SABIC CT-50
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: The Supplier must retain all audit logs from information systems and…
  statement: >-
    The Supplier must retain all audit logs from information systems and applications storing, processing,
    or transmitting SABIC data for one (1) year, as per local and international laws and regulations (whichever
    is greater) depending upon the type of data being collected.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-50
  tags: []
- control_id: CT-51
  external_reference: SABIC CT-51
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: The Supplier must ensure the isolation of tenants.
  statement: >-
    The Supplier must ensure the isolation of tenants. The SABIC's environments/data (specifically virtual
    server if applicable) must be separated from other customer environments/data hosted at the cloud
    services provider.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-51
  tags: []
- control_id: CT-52
  external_reference: SABIC CT-52
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: The Supplier must have the capability to restrict the storage of the customer…
  statement: >-
    The Supplier must have the capability to restrict the storage of the customer data to specific countries
    or geographical locations in compliance with applicable laws and regulations.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-52
  tags: []
- control_id: CT-53
  external_reference: SABIC CT-53
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: >-
    The supplier must ensure the implementation of a data loss prevention (DLP) technology.
  statement: >-
    The supplier must ensure the implementation of a data loss prevention (DLP) technology.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-53
  tags: []
- control_id: CT-54
  external_reference: SABIC CT-54
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must ensure that physical assets are adequately secured and that…
  statement: >-
    The Supplier must ensure that physical assets are adequately secured and that access to the physical
    assets as well as SABIC’s data is restricted to authorized personnel only. Access in such cases must
    be documented, and compliant with any applicable legal requirements.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-54
  tags: []
- control_id: CT-55
  external_reference: SABIC CT-55
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must implement data validation on all input fields for…
  statement: >-
    The Supplier must implement data validation on all input fields for applications or Cloud Services
    used by SABIC to only accept input with valid data type, syntax, length range, sanitized, accurate,
    well-formed, and adheres to defined constraints.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-55
  tags: []
- control_id: CT-56
  external_reference: SABIC CT-56
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Access to the Internet must be restricted by Content-filtering technologies to…
  statement: >-
    Access to the Internet must be restricted by Content-filtering technologies to block: • Malicious
    and suspicious websites. • Personal and non-company email services. • Personal and non-company approved
    public cloud services.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-56
  tags: []
- control_id: CT-57
  external_reference: SABIC CT-57
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Physical security procedures defined and followed that address the control of…
  statement: >-
    Physical security procedures defined and followed that address the control of physical access, environmental
    protection, equipment maintenance, equipment siting, visitor management etc.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-57
  tags: []
- control_id: CT-58
  external_reference: SABIC CT-58
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Access to sensitive areas (server location, tape library, computer room, etc.)…
  statement: >-
    Access to sensitive areas (server location, tape library, computer room, etc.) must be physically
    restricted to authorized personnel only; wherever applicable physical access control must be implemented.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-58
  tags: []
- control_id: CT-59
  external_reference: SABIC CT-59
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The facilities must be protected against fire, water damage, vandalism, and…
  statement: >-
    The facilities must be protected against fire, water damage, vandalism, and other threats known or
    likely to occur at their geographical locations.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-59
  tags: []
- control_id: CT-60
  external_reference: SABIC CT-60
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Facilities and server rooms must be monitored via a Closed-Circuit Television…
  statement: >-
    Facilities and server rooms must be monitored via a Closed-Circuit Television (CCTV) system on a 24/7
    basis. All video surveillance data must be protected from unauthorized disclosure and modification
    and maintained for at least ninety (90) days or otherwise in accordance with the local/regional regulations.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-60
  tags: []
- control_id: CT-61
  external_reference: SABIC CT-61
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Uninterruptible Power Supplies (UPS) and surge protector must be used to…
  statement: >-
    Uninterruptible Power Supplies (UPS) and surge protector must be used to provide short-term and long-term
    power when the power fails and to protect information systems from voltage spikes and reductions.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-61
  tags: []
- control_id: CT-62
  external_reference: SABIC CT-62
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Cloud service provider must establish mechanisms to automatically identify…
  statement: >-
    The Cloud service provider must establish mechanisms to automatically identify equipment using connection
    authentication (cryptographic based mechanisms that get verified after establishing a connection between
    the communicating services).
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-62
  tags: []
- control_id: CT-63
  external_reference: SABIC CT-63
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: >-
    The Supplier must return the SABIC data in a usable format upon service completion.
  statement: >-
    The Supplier must return the SABIC data in a usable format upon service completion.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-63
  tags: []
- control_id: CT-64
  external_reference: SABIC CT-64
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must provide security documentation for any equipment or services…
  statement: >-
    The Supplier must provide security documentation for any equipment or services under request by SABIC.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-64
  tags: []
- control_id: CT-65
  external_reference: SABIC CT-65
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must use a build process that reliably builds a complete…
  statement: >-
    The Supplier must use a build process that reliably builds a complete distribution from source. This
    process must include a method for verifying the integrity of the software delivered to Client, such
    as signing with a certificate from an industry recognized Certificate Authority.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-65
  tags: []
- control_id: CT-66
  external_reference: SABIC CT-66
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Supplier system development environments, including testing environment and…
  statement: >-
    Supplier system development environments, including testing environment and integration platforms,
    must be protected.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-66
  tags: []
- control_id: CT-67
  external_reference: SABIC CT-67
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must use a build process that reliably builds a complete…
  statement: >-
    The Supplier must use a build process that reliably builds a complete distribution from source. This
    process must include a method for verifying the integrity of the software delivered to Client, such
    as signing with a certificate from an industry recognized Certificate Authority.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-67
  tags: []
- control_id: CT-68
  external_reference: SABIC CT-68
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must apply, test, and validate the appropriate patches and updates…
  statement: >-
    The Supplier must apply, test, and validate the appropriate patches and updates and/or workarounds
    on a test version of the application before distribution.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-68
  tags: []
- control_id: CT-69
  external_reference: SABIC CT-69
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must provide periodic security patches certified by it and…
  statement: >-
    The Supplier must provide periodic security patches certified by it and upgrades and implementation
    guidance or recommendations with respect to cybersecurity.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-69
  tags: []
- control_id: CT-70
  external_reference: SABIC CT-70
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: All media must be inventoried and labelled as per the classification level.
  statement: >-
    All media must be inventoried and labelled as per the classification level. Inventory audit should
    be used to avoid unknown or unresolved discrepancies in tape inventories in order to find the information
    needed to get up and running in the event of a disaster.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-70
  tags: []
- control_id: CT-71
  external_reference: SABIC CT-71
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Backup media must be secured to block/inhibit unauthorized physical access.
  statement: Backup media must be secured to block/inhibit unauthorized physical access.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-71
  tags: []
- control_id: CT-72
  external_reference: SABIC CT-72
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Supplier must establish and follow regular procedures for backup of critical…
  statement: >-
    Supplier must establish and follow regular procedures for backup of critical systems and SABIC’s data,
    software, and websites.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-72
  tags: []
- control_id: CT-73
  external_reference: SABIC CT-73
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Backup stored at an off-site location must be encrypted using at least AES…
  statement: >-
    Backup stored at an off-site location must be encrypted using at least AES encryption algorithm, and
    128 bits key.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-73
  tags: []
- control_id: CT-74
  external_reference: SABIC CT-74
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Clear desk and clear screen policy must be enforced in the organization.
  statement: Clear desk and clear screen policy must be enforced in the organization.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-74
  tags: []
- control_id: CT-75
  external_reference: SABIC CT-75
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must monitor Technology Assets, Systems, and applications to…
  statement: >-
    The Supplier must monitor Technology Assets, Systems, and applications to identify unauthorized access,
    or unauthorized activity.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-75
  tags: []
- control_id: CT-76
  external_reference: SABIC CT-76
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must conduct an analysis of software errors, most common…
  statement: >-
    The Supplier must conduct an analysis of software errors, most common programming errors, vulnerabilities,
    risks a threat as early as possible during the software lifecycle. The Supplier must share with SABIC
    all security-relevant information regarding the vulnerabilities, risks, threats, and mitigated steps
    taken.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-76
  tags: []
- control_id: CT-77
  external_reference: SABIC CT-77
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must ensure that errors and events within the application that may…
  statement: >-
    The Supplier must ensure that errors and events within the application that may be the result of failures,
    crashes, unauthorized access attempts or other indicators of potential compromise, are appropriately
    recorded in a log file conforming to industry standards.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-77
  tags: []
- control_id: CT-78
  external_reference: SABIC CT-78
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: The Supplier must perform security scans (with the most current signature…
  statement: >-
    The Supplier must perform security scans (with the most current signature files) to verify that the
    system has not been compromised during the testing phase or it has open vulnerabilities. The Supplier
    must provide to SABIC written documentation of the results of the scans and tests it has performed
    along with a mitigation plan. These vulnerabilities must be mitigated within a pre-negotiated period.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-78
  tags: []
- control_id: CT-79
  external_reference: SABIC CT-79
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: All physical access control logs periodically reviewed and retained as per…
  statement: >-
    All physical access control logs periodically reviewed and retained as per retention requirements.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-79
  tags: []
- control_id: CT-80
  external_reference: SABIC CT-80
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Systems’ logs and critical files must be protected from unauthorized access,…
  statement: >-
    Systems’ logs and critical files must be protected from unauthorized access, tampering, illegitimate
    modification and/or deletion.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-80
  tags: []
- control_id: CT-81
  external_reference: SABIC CT-81
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Records kept of all suspected or actual faults and all maintenance activities…
  statement: >-
    Records kept of all suspected or actual faults and all maintenance activities performed on equipment's
    Is the maintenance must be carried out by authorized personnel only.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-81
  tags: []
- control_id: CT-82
  external_reference: SABIC CT-82
  domain: DETECT
  subdomain: Continuous Monitoring (DE.CM)
  title: The remediation of newly discovered critical vulnerabilities presenting…
  statement: >-
    The remediation of newly discovered critical vulnerabilities presenting significant risks must be
    performed in a timely manner: • Critical Risk: immediate correction up to fourteen (14) calendar days
    of critical vendor patch release, notification from SABIC, or discovered security breach whichever
    is earlier. • High Risk: within one (1) month of vendor patch release or discovered security breach
    whichever is earlier. • Medium and Low Risk: within three (3) months of discovery.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, DETECT / Continuous Monitoring (DE.CM) / CT-82
  tags: []
- control_id: CT-83
  external_reference: SABIC CT-83
  domain: DETECT
  subdomain: Continuous Monitoring (DE.CM)
  title: The supplier must be continuously monitoring cybersecurity events through a…
  statement: >-
    The supplier must be continuously monitoring cybersecurity events through a security incident and
    event management process.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, DETECT / Continuous Monitoring (DE.CM) / CT-83
  tags: []
- control_id: CT-84
  external_reference: SABIC CT-84
  domain: DETECT
  subdomain: Adverse Event Analysis (DE.AE)
  title: Suppliers must periodically aggregate and correlate data from multiple systems…
  statement: >-
    Suppliers must periodically aggregate and correlate data from multiple systems and critical applications
    such as Firewalls, IDS/IPS, and anti-virus in a central repository for event monitoring and analysis
    purposes.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, DETECT / Adverse Event Analysis (DE.AE) / CT-84
  tags: []
- control_id: CT-85
  external_reference: SABIC CT-85
  domain: DETECT
  subdomain: Adverse Event Analysis (DE.AE)
  title: The Supplier must have a Disaster Recovery Plan (DR Plan) which is documented,…
  statement: >-
    The Supplier must have a Disaster Recovery Plan (DR Plan) which is documented, maintained, tested,
    and communicated to appropriate parties. The DR Plan should address the recovery of Assets and communications
    following a major disruption to business operations.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, DETECT / Adverse Event Analysis (DE.AE) / CT-85
  tags: []
- control_id: CT-86
  external_reference: SABIC CT-86
  domain: RESPOND
  subdomain: Incident Management (RS.MA)
  title: The Supplier must have security mechanisms in place to achieve resilience…
  statement: >-
    The Supplier must have security mechanisms in place to achieve resilience requirements in normal and
    adverse situations and ensure high availability of its services. This includes having sufficient capacity
    available.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, RESPOND / Incident Management (RS.MA) / CT-86
  tags: []
- control_id: CT-87
  external_reference: SABIC CT-87
  domain: RESPOND
  subdomain: Incident Management (RS.MA)
  title: Procedures for the backups of the provisioned solution and SABIC's data must be…
  statement: >-
    Procedures for the backups of the provisioned solution and SABIC's data must be established, conducted,
    maintained, and tested on a regular basis. SABIC can define more specific requirements for backup
    in the Scope of Work.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, RESPOND / Incident Management (RS.MA) / CT-87
  tags: []
- control_id: CT-88
  external_reference: SABIC CT-88
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: Supplier must have an Incident Response capability that includes preparation,…
  statement: >-
    Supplier must have an Incident Response capability that includes preparation, detection and analysis,
    containment, eradication, recovery, documentation and preservation of evidence, communication protocols
    and lessons learned.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-88
  tags: []
- control_id: CT-89
  external_reference: SABIC CT-89
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: >-
    Documented Security Incident Response process covering physical security incidents.
  statement: >-
    Documented Security Incident Response process covering physical security incidents.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-89
  tags: []
- control_id: CT-90
  external_reference: SABIC CT-90
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: The Cloud Services provider must host and storage SABIC´s information…
  statement: >-
    The Cloud Services provider must host and storage SABIC´s information originated or owned by Saudi-Based
    departments or affiliates inside the Kingdom of Saudi Arabia.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-90
  tags: []
- control_id: CT-91
  external_reference: SABIC CT-91
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: The Cloud Services provider must fulfill NCA's requests to remove software or…
  statement: >-
    The Cloud Services provider must fulfill NCA's requests to remove software or services, provided by
    third-party providers that may be considered a cybersecurity threat to national organizations, from
    the marketplace provided to SABIC
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-91
  tags: []
- control_id: CT-92
  external_reference: SABIC CT-92
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: If SABIC´s information originated or owned by Saudi-Based classified by SABIC…
  statement: >-
    If SABIC´s information originated or owned by Saudi-Based classified by SABIC as critical is involved
    in the cloud service: The Cloud services provider must be following NCA’s Cloud Cybersecurity Controls
    (CCC)
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-92
  tags: []
- control_id: CT-93
  external_reference: SABIC CT-93
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: If SABIC data or systems classified by SABIC as critical is involved in the…
  statement: >-
    If SABIC data or systems classified by SABIC as critical is involved in the service: Outsourcing services
    must rely on Saudi companies and organizations, in accordance with the relevant legislative and regulatory
    requirements.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-93
  tags: []
- control_id: CT-94
  external_reference: SABIC CT-94
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: Cybersecurity managed services centers for monitoring and operations must be…
  statement: >-
    Cybersecurity managed services centers for monitoring and operations must be completely present inside
    the Kingdom of Saudi Arabia.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-94
  tags: []
- control_id: CT-95
  external_reference: SABIC CT-95
  domain: RESPOND
  subdomain: Incident Response Reporting and Communication (RS.CO)
  title: If a hosted telework system is provided to Saudi-Based SABIC systems, it must…
  statement: >-
    If a hosted telework system is provided to Saudi-Based SABIC systems, it must be inside the Kingdom
    of Saudi Arabia.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RESPOND / Incident Response Reporting and Communication (RS.CO) /
    CT-95
  tags: []

# CyberTrust KSA — Official control dataset (Phase 2G)
# Source of truth: SABIC CyberTrust Standard v1.0 (NOT the legacy 334 Excel).
framework_version_code: SABIC-CYBERTRUST-1-0
source_document_title: SABIC CyberTrust Standard v1.0
expected_control_count: 94
notes: >-
  Statements transcribed from the official SABIC CyberTrust Report Template v1.0; domain/subdomain mapped
  from the SABIC CyberTrust Standard v1.0 (NIST CSF 2.0 functions/categories). Excluded: CT-24 (present
  in the report template but absent from the governing Standard PDF; domain unconfirmed, deferred). NOT
  derived from the legacy 334 Excel.
controls:
- control_id: CT-01
  external_reference: SABIC CT-01
  domain: GOVERN
  subdomain: Policies, Processes, and Procedures (GV.PO)
  title: Suppliers must have defined policies for information security, approved by…
  statement: >-
    Suppliers must have defined policies for information security, approved by their management, and communicated
    to the people with access to their information systems.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, GOVERN / Policies, Processes, and Procedures (GV.PO) / CT-01
  tags: []
- control_id: CT-02
  external_reference: SABIC CT-02
  domain: IDENTIFY
  subdomain: Improvement (ID.IM)
  title: Suppliers will perform, at minimum, a self-assessment of their operational…
  statement: >-
    Suppliers will perform, at minimum, a self-assessment of their operational resilience and Cybersecurity
    practices in order to identify and appropriately manage potential risks. The self-assessment must
    include, at minimum, all the requirements included in this document. The self-assessment must be repeated
    at yearly intervals (or when requested by SABIC).
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Improvement (ID.IM) / CT-02
  tags: []
- control_id: CT-03
  external_reference: SABIC CT-03
  domain: IDENTIFY
  subdomain: Asset Management (ID.AM)
  title: SABIC Assets associated with information processing facilities managed by the…
  statement: >-
    SABIC Assets associated with information processing facilities managed by the Supplier must be identified
    and an inventory of these Assets must be drawn up and maintained by the Supplier.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, IDENTIFY / Asset Management (ID.AM) / CT-03
  tags: []
- control_id: CT-04
  external_reference: SABIC CT-04
  domain: PROTECT
  subdomain: Asset Management (ID.AM)
  title: Supplier must have a defined, documented and enforced Access Management Policy…
  statement: >-
    Supplier must have a defined, documented and enforced Access Management Policy for physical and Logical
    access to networks, systems, and applications in Supplier Environment that processes, accesses, or
    stores SABIC ‘s data. At least the Access control management must include: • The access rights granting,
    changing, and disabling based on documented and authorized approvals. • A process implemented to ensure
    the disabling of account of personnel no longer on employment or contracted. • The periodical review
    of access rights to ensure that access is fit for purpose. In addition, it is recommended to implement
    the following password security requirements. • Password minimum length of 8 characters and complexity
    rules. • Password expiry set not less than 90 days. • Account lockout threshold set to 10 attempts
    (or less). • No password sharing allowed.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Asset Management (ID.AM) / CT-04
  tags: []
- control_id: CT-05
  external_reference: SABIC CT-05
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: Supplier must define and implement the security perimeters of their Environment…
  statement: >-
    Supplier must define and implement the security perimeters of their Environment to protect key systems/services
    and physical assets.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-05
  tags: []
- control_id: CT-06
  external_reference: SABIC CT-06
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: Supplier must protect both paper and electronic information or any other media…
  statement: >-
    Supplier must protect both paper and electronic information or any other media storing SABIC’s data,
    by limiting access to information on those media to the authorized System Users and Sanitize or destroy
    information system media before disposal or release for reuse.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-06
  tags: []
- control_id: CT-07
  external_reference: SABIC CT-07
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: Suppliers must apply preventive measures confirming the adequacy and integrity…
  statement: >-
    Suppliers must apply preventive measures confirming the adequacy and integrity of their System Users
    involved in the provision of services to SABIC. These measures must, at minimum, include the verification
    of their references and identity and the employee’s agreement for proper use of information systems.
    The Supplier must report all changes related to System Users with access to SABIC’s information systems
    so that their access authorization can be updated by SABIC accordingly. The Supplier must have formal
    procedures for off-boarding employees and contractors. Off-boarding procedures must include the return
    of Assets, and removal of all associated access rights.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-07
  tags: []
- control_id: CT-08
  external_reference: SABIC CT-08
  domain: PROTECT
  subdomain: Awareness and Training (PR.AT)
  title: Supplier must provide and require all System Users to take a yearly mandatory…
  statement: >-
    Supplier must provide and require all System Users to take a yearly mandatory Cybersecurity awareness
    training that addresses acceptable use and good computing practices. Training must address at least
    the following topics: • Cybersecurity Acceptable Use. • Internet and social media security. • Social
    Engineering and Phishing emails. • Confidentiality and not sharing credentials (e.g., user/password).
    • Information security policies.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Awareness and Training (PR.AT) / CT-08
  tags: []
- control_id: CT-09
  external_reference: SABIC CT-09
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: 'The Supplier must protect its email service with at least the following: •…'
  statement: >-
    The Supplier must protect its email service with at least the following: • Analyzing and filtering
    email messages (specifically regarding Phishing and spam) using up-to-date email protection techniques
    • Multi-Factor Authentication for remote and webmail access to email service. • Email archiving and
    Backup. • Secure management and protection against Advanced Persistent Threats. • Validation of the
    Supplier email service domains (e.g., using Sender Policy Framework).
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-09
  tags: []
- control_id: CT-10
  external_reference: SABIC CT-10
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Supplier technology Assets and systems must be regularly updated with the…
  statement: >-
    Supplier technology Assets and systems must be regularly updated with the operating system (OS), software
    and applications Patches provided by their manufacturer according with industry best practices.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-10
  tags: []
- control_id: CT-11
  external_reference: SABIC CT-11
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Supplier technology Assets must be protected with Anti-Malware software.
  statement: >-
    Supplier technology Assets must be protected with Anti-Malware software. Updates must be applied daily,
    and full system scans must be performed at least every two weeks. In case of virus/malware detection,
    the virus/malware must be eradicated promptly, and the affected systems restored to a clean status.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-11
  tags: []
- control_id: CT-12
  external_reference: SABIC CT-12
  domain: PROTECT
  subdomain: Technology Infrastructure Resilience (PR.IR)
  title: Networks in the Supplier Environment shall be managed and controlled to protect…
  statement: >-
    Networks in the Supplier Environment shall be managed and controlled to protect information in systems
    and applications. Network controls shall be deployed by means of Firewalls and other network security
    technologies that includes Intrusion Detection Systems (IPS) or Intrusion Detection Systems (IDS)
    and acting as network policy enforcement points.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, PROTECT / Technology Infrastructure Resilience (PR.IR) / CT-12
  tags: []
- control_id: CT-13
  external_reference: SABIC CT-13
  domain: DETECT
  subdomain: Continuous Monitoring (DE.CM)
  title: Supplier must create and maintain information system Audit Logs needed to allow…
  statement: >-
    Supplier must create and maintain information system Audit Logs needed to allow the analysis, investigation,
    and reporting of unauthorized, or inappropriate information system activity in the Supplier Environment
    and ensure that the actions of individual information System Users can be attributed to those System
    Users.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, DETECT / Continuous Monitoring (DE.CM) / CT-13
  tags: []
- control_id: CT-14
  external_reference: SABIC CT-14
  domain: RESPOND
  subdomain: Incident Management (RS.MA)
  title: Supplier must have an incident handling process for information systems in the…
  statement: >-
    Supplier must have an incident handling process for information systems in the Supplier Environment,
    which includes the preparation to detect, analyze, contain, recover and response to incidents.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, RESPOND / Incident Management (RS.MA) / CT-14
  tags: []
- control_id: CT-15
  external_reference: SABIC CT-15
  domain: RESPOND
  subdomain: Incident Analysis (RS.AN)
  title: The supplier must define a clear process of how incidents are categorized based…
  statement: >-
    The supplier must define a clear process of how incidents are categorized based on the impact it could
    leave.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, RESPOND / Incident Analysis (RS.AN) / CT-15
  tags: []
- control_id: CT-16
  external_reference: SABIC CT-16
  domain: RECOVER
  subdomain: Incident Recovery Communication (RC.CO)
  title: The Supplier must notify and report to SABIC any adverse situation or…
  statement: >-
    The Supplier must notify and report to SABIC any adverse situation or Cybersecurity incident that
    occurs in the Supplier Environment, affecting any networks, systems or applications that process,
    access, or store SABIC’s data. The notification must be made as soon as practicable, but no later
    than twenty-four (24) hours after the Supplier becomes aware of it or should have become aware of
    it. The Supplier must make the notification to SABIC using the following channel: Email: CyberSecurityCenter@SABIC.COM
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, RECOVER / Incident Recovery Communication (RC.CO) / CT-16
  tags: []
- control_id: CT-17
  external_reference: SABIC CT-17
  domain: GOVERN
  subdomain: Risk Management Strategy (GV.RM)
  title: The Supplier must maintain a Cybersecurity risk management and mitigation…
  statement: >-
    The Supplier must maintain a Cybersecurity risk management and mitigation program, with clear roles
    & responsibilities, processes, risk appetite and tolerance, risk strategy, and Third Party Risk Management.
    The supplier must maintain a Cybersecurity risk management and mitigation program, with clear roles
    & responsibilities, processes, risk appetite, risk strategy, and Third-Party Risk Management.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, GOVERN / Risk Management Strategy (GV.RM) / CT-17
  tags: []
- control_id: CT-18
  external_reference: SABIC CT-18
  domain: GOVERN
  subdomain: Policies, Processes, and Procedures (GV.PO)
  title: The Supplier must have policies and processes to classify information in terms…
  statement: >-
    The Supplier must have policies and processes to classify information in terms of its value, sensitivity,
    criticality, confidentiality and regulatory requirements. The Supplier must have policies and processes
    to classify information in terms of its value, criticality, and confidentiality.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, GOVERN / Policies, Processes, and Procedures (GV.PO) / CT-18
  tags: []
- control_id: CT-19
  external_reference: SABIC CT-19
  domain: GOVERN
  subdomain: Policies, Processes, and Procedures (GV.PO)
  title: >-
    The Supplier must have employee(s) whose primary responsibility is Cybersecurity.
  statement: >-
    The Supplier must have employee(s) whose primary responsibility is Cybersecurity. Responsibilities
    of those personnel must include maintaining the security of information systems and ensuring compliance
    with existing policies.
  level: control
  source_reference: >-
    SABIC CyberTrust Standard v1.0, GOVERN / Policies, Processes, and Procedures (GV.PO) / CT-19
  tags: []

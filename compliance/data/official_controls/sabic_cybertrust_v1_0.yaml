  external_reference: SABIC CT-39
  domain: PROTECT
  subdomain: Platform Security (PR.PS)
  title: The Supplier must implement sufficient mechanisms to protect data-in-transit.
  statement: >-
    The Supplier must implement sufficient mechanisms to protect data-in-transit. Data-in-transit should
    be encrypted with strong, approved algorithms. End-to-end encryption should be enforced where applicable
    using VPN and/or TLS capable connectivity solutions with secure key exchange and forward-secrecy capability.
  level: control
  source_reference: SABIC CyberTrust Standard v1.0, PROTECT / Platform Security (PR.PS) / CT-39
  tags: []

    In addition to the subcontrols in the ECC control 4-2-3, cybersecurity requirements relat- ed to the
    use of hosting and cloud computing services must include at least the following: 3-1-1-1 The location
    of the hosted telework systems must be inside the Kingdom of Saudi Arabia. Third Party And Cloud Computing
    Cybersecurity Sharing Notice: White Document Classification: Open Appendices

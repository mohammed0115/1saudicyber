  external_reference: NCA TCC 2-10-2
  domain: Cybersecurity Defense
  subdomain: Penetration Testing
  title: With reference to the ECC subcontrol 2-11-3-2, penetration tests must be…
  statement: >-
    With reference to the ECC subcontrol 2-11-3-2, penetration tests must be conducted on telework systems
    at least once every year.
  level: control
  source_page: null
  source_reference: >-
    NCA Telework Cybersecurity Controls (TCC) 1:2021, Cybersecurity Defense / Penetration Testing / 2-10-2
  tags: []
- control_id: 2-11-1
  external_reference: NCA TCC 2-11-1
  domain: Cybersecurity Defense
  subdomain: Cybersecurity Events Logs and Monitoring Management
  title: In addition to the subcontrols in the ECC control 2-12-3, cybersecurity…
  statement: >-
    In addition to the subcontrols in the ECC control 2-12-3, cybersecurity requirements for event logs
    and monitoring management for telework systems must include at least the following: 2-11-1-1 Activating
    cybersecurity events logs on all technical components of tele- work systems. 2-11-1-2 Monitoring and
    analyzing user behavior (UBA). 2-11-1-3 Monitoring telework systems events around the clock. 2-11-1-4
    Updating and implementing cybersecurity monitoring procedures around the clock, to include monitoring
    remote access operations, especially remote access from outside the Kingdom of Saudi Arabia, after
    checking their authenticity. Sharing Notice: White Document Classification: Open
  level: control
  source_page: null
  source_reference: >-
    NCA Telework Cybersecurity Controls (TCC) 1:2021, Cybersecurity Defense / Cybersecurity Events Logs
    and Monitoring Management / 2-11-1
  tags: []
- control_id: 2-11-2
  external_reference: NCA TCC 2-11-2
  domain: Cybersecurity Defense
  subdomain: Cybersecurity Events Logs and Monitoring Management
  title: With reference to the ECC subcontrol 2-12-3-5, retention period of…
  statement: >-
    With reference to the ECC subcontrol 2-12-3-5, retention period of cybersecurity’s tele- work systems
    event logs must be 12 months minimum, in accordance with relevant legisla- tive and regulatory requirements.
  level: control
  source_page: null
  source_reference: >-
    NCA Telework Cybersecurity Controls (TCC) 1:2021, Cybersecurity Defense / Cybersecurity Events Logs
    and Monitoring Management / 2-11-2
  tags: []
- control_id: 2-12-1
  external_reference: NCA TCC 2-12-1
  domain: Cybersecurity Defense
  subdomain: Cybersecurity Incident and Threat Management
  title: In addition to the sub-controls within control 2-13-3 in the ECC, cybersecurity…
  statement: >-
    In addition to the sub-controls within control 2-13-3 in the ECC, cybersecurity require- ments for
    incident and threat management related to telework systems shall include at least the following: 2-12-1-1
    Updating cyber security incidents response plans and contact informa- tion within the organization
    in a way that is compatible with the telework situation and to ensure the ability to communicate and
    the preparedness of the incident response teams. 2-12-1-2 Periodically obtaining and dealing with
    threat intelligence information related to telework systems. 2-12-1-3 Addressing and implementing
    the recommendations and alerts for cyber security incidents and threats issued by the Sector regulator
    or by the National Cybersecurity Authority (NCA). Document Classification: Open
  level: control
  source_page: null
  source_reference: >-
    NCA Telework Cybersecurity Controls (TCC) 1:2021, Cybersecurity Defense / Cybersecurity Incident and
    Threat Management / 2-12-1

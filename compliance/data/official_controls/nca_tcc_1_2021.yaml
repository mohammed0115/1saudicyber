  external_reference: NCA TCC 2-10-1
  domain: Cybersecurity Defense
  subdomain: Penetration Testing
  title: In addition to the sub-controls within control 2-11-3 in the ECC, cybersecurity…
  statement: >-
    In addition to the sub-controls within control 2-11-3 in the ECC, cybersecurity require- ments for
    penetration testing related to telework systems shall include at least the follow- ing: 2-10-1-1 Scope
    of penetration tests must cover all of the telework systems’ techni- cal components.
  level: control
  source_page: null
  source_reference: >-
    NCA Telework Cybersecurity Controls (TCC) 1:2021, Cybersecurity Defense / Penetration Testing / 2-10-1
  tags: []

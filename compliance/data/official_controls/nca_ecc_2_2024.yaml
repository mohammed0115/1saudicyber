  subdomain: Cryptography
  title: Cybersecurity requirements for cryptography shall include at least the…
  statement: >-
    Cybersecurity requirements for cryptography shall include at least the requirements in the National
    Cryptographic Standards, published by NCA. The appropriate cryptographic standard level shall be implemented
    based on the nature and sensitivity of the data, systems, and networks to be protected as well as
    the entity’s risk assessment, ‫ﻣﻘﻴﺪ‬ - - and as per the relevant legislative and regulatory requirements,
    as follows: 2.8.3.1 Approved cryptographic systems and solutions standards and their technical and
    regulatory restrictions. 2.8.3.2 Secure management of cryptographic keys during their lifecycles.
    2.8.3.3 Encryption of data in-transit and at-rest, as per their classification and the relevant legislative
    and regulatory requirements.
  level: control
  source_page: null

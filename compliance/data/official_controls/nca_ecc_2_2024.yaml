  subdomain: Cybersecurity in Human Resources
  title: Cybersecurity requirements for personnel during their employment relationship…
  statement: >-
    Cybersecurity requirements for personnel during their employment relationship with the entity shall
    include the following as a minimum: 1.9.4.1 Cybersecurity awareness (during on-boarding and during
    employment). 1.9.4.2 Implementation and compliance with cybersecurity requirements, as per the entity’s
    cybersecurity policies, procedures, and operations.
  level: control
  source_page: null

  domain: Cybersecurity Defense
  subdomain: Web Application Security
  title: Cybersecurity requirements for protection of external web applications of the…
  statement: >-
    Cybersecurity requirements for protection of external web applications of the entity shall include
    the following as a minimum: 2.15.3.1 Use of web application firewall. 2.15.3.2 Adoption of the multi-tier
    architecture principle. 2.15.3.3 Use of secure protocols (e.g. HTTPS). 2.15.3.4 Clarification of the
    secure usage policy for users. 2.15.3.5 User authentication, and the suitable authentication factors
    and their numbers as well as the authentication techniques shall be defined based on the result of
    impact assessment of authentication failure and bypass for users’ access.
  level: control

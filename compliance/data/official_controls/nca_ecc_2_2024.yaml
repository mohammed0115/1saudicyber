  domain: Cybersecurity Governance
  subdomain: Periodical Cybersecurity Review and Audit
  title: The implementation of cybersecurity controls by the entity shall be reviewed…
  statement: >-
    The implementation of cybersecurity controls by the entity shall be reviewed and audited by parties
    other than the cybersecurity department at the entity, provided that the audit and review are to be
    conducted independently while considering the principle of conflict of interest, as per the Generally
    Accepted Auditing Standards (GAAS) and the relevant legislative and regulatory requirements.
  level: control
  source_page: null

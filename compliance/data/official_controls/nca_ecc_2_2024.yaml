  subdomain: Cybersecurity in Human Resources
  title: Cybersecurity requirements prior to the commencement of the employment…
  statement: >-
    Cybersecurity requirements prior to the commencement of the employment relationship between personnel
    and the entity shall include the following as a minimum: 1.9.3.1 Incorporating the personnel’s cybersecurity
    responsibilities clauses and non- disclosure clauses in their employment contracts with the entity
    (including during and after employment end/termination with the entity). 1.9.3.2 Conducting screening
    or vetting for personnel in cybersecurity positions and technical positions with critical and privileged
    powers.

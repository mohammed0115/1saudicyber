  domain: Cybersecurity Governance
  subdomain: Periodical Cybersecurity Review and Audit
  title: The results of cybersecurity audits and reviews shall be documented and…
  statement: >-
    The results of cybersecurity audits and reviews shall be documented and presented to the cybersecurity
    supervisory committee and the Authorized Official. Results shall include the audit and review scope,
    observations, recommendations, corrective actions, and remediation plans.
  level: control
  source_page: null
  source_reference: >-

- control_id: 2-14-3
  external_reference: NCA ECC 2-14-3
  domain: Cybersecurity Defense
  subdomain: Physical Security
  title: Cybersecurity requirements for protection of information and technology assets…
  statement: >-
    Cybersecurity requirements for protection of information and technology assets of the entity against
    unauthorized physical access, loss, theft, and damage shall include the following as a minimum: 2.14.3.1
    Authorized access to critical areas within the entity (e.g. the entity’s data center, disaster recovery
    center, critical information processing facilities, security surveillance center, network connection
    rooms, technical device and equipment supply areas, etc.). 2.14.3.2 Access and monitoring logs (CCTV).
    2.14.3.3 Protection of access and monitoring log information. 2.14.3.4 Security of the destruction
    and re-use of physical assets that hold classified information (including paper documents and storage
    media). 2.14.3.5 Security of devices and equipment inside and outside the entity’s facilities.
  level: control
  source_page: null
  source_reference: NCA ECC 2:2024, Cybersecurity Defense / Physical Security / 2-14-3

- control_id: 1-2-1
  external_reference: NCA ECC 1-2-1
  domain: Cybersecurity Governance
  subdomain: Cybersecurity Management
  title: A department for cybersecurity shall be established within the entity.
  statement: >-
    A department for cybersecurity shall be established within the entity. This department shall be independent
    from the Information Technology and Communications Department (As per High Order No. 37140, dated
    14/08/1438H.). It is recommended that the Cybersecurity Department reports directly to the head of
    the entity or his/her delegate while ensuring that this does not result in a conflict of interests.
  level: control
  source_page: null
  source_reference: NCA ECC 2:2024, Cybersecurity Governance / Cybersecurity Management / 1-2-1
  tags: []
- control_id: 1-2-2
  external_reference: NCA ECC 1-2-2
  domain: Cybersecurity Governance
  subdomain: Cybersecurity Management
  title: All cybersecurity positions shall be filled out with full-time and qualified…
  statement: >-
    All cybersecurity positions shall be filled out with full-time and qualified Saudi cybersecurity professionals.
  level: control
  source_page: null
  source_reference: NCA ECC 2:2024, Cybersecurity Governance / Cybersecurity Management / 1-2-2
  tags: []
- control_id: 1-2-3
  external_reference: NCA ECC 1-2-3
  domain: Cybersecurity Governance
  subdomain: Cybersecurity Management
  title: A cybersecurity supervisory committee shall be established pursuant to the…
  statement: >-
    A cybersecurity supervisory committee shall be established pursuant to the instruction of the entity’s
    Authorized Official to ensure compliance with, support for, and monitoring of the implementation of
    the cybersecurity programs and regulations. The committee’s members, responsibilities, and governance
    framework shall be identified, documented, and approved. The committee shall include the head of the
    cybersecurity ‫ﻣﻘﻴﺪ‬ - - department as a member. It is recommended that the committee reports directly
    to the head of the entity or his/her delegate while ensuring that this does not result in a conflict
    of interests.
  level: control
  source_page: null
  source_reference: NCA ECC 2:2024, Cybersecurity Governance / Cybersecurity Management / 1-2-3
  tags: []

  title: Cybersecurity requirements for protection of information systems and processing…
  statement: >-
    Cybersecurity requirements for protection of information systems and processing facilities of the
    entity shall include the following as a minimum: 2.3.3.1 Protection from viruses, suspicious programs
    and activities, and malware on workstations and servers, using modern and advanced protection technologies
    and mechanisms, and securely managing them. 2.3.3.2 Strict restriction on the use of external storage
    media and their security. 2.3.3.3 Patch management for systems, applications, and devices. 2.3.3.4
    Centralized clock synchronization with an accurate and trusted source, such as sources provided by
    the Saudi Standards, Metrology and Quality Organization (SASO).
  level: control

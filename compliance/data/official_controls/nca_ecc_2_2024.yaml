- control_id: 4-1-2
  external_reference: NCA ECC 4-1-2
  domain: Third-Party and Cloud Computing Cybersecurity
  subdomain: Third-Party Cybersecurity
  title: Cybersecurity requirements for contracts and agreements with third parties, e.g.
  statement: >-
    Cybersecurity requirements for contracts and agreements with third parties, e.g. ServiceLevel Agreement(SLA),
    which, ifimpaired, may affect the entity's data or services shall include the following as a minimum:
    4.1.2.1 Clauses of non-disclosure and the secure removal of the entity’s data by the third party upon
    the end of service. 4.1.2.2 Communication procedures in case of the occurrence of a cybersecurity
    incident. 4.1.2.3 Obligating the third party to apply the entity’s cybersecurity requirements and
    policies and the relevant legislative and regulatory requirements.
  level: control
  source_page: null
  source_reference: >-
    NCA ECC 2:2024, Third-Party and Cloud Computing Cybersecurity / Third-Party Cybersecurity / 4-1-2
  tags: []
- control_id: 4-1-3
  external_reference: NCA ECC 4-1-3
  domain: Third-Party and Cloud Computing Cybersecurity
  subdomain: Third-Party Cybersecurity
  title: Cybersecurity requirements for contracts and agreements with third parties…
  statement: >-
    Cybersecurity requirements for contracts and agreements with third parties providing IT or cybersecurity
    outsourcing or managed services shall include the following as a minimum: 4.1.3.1 Conducting a cybersecurity
    risk assessment and ensuring the availability of risk mitigation controls before signing contracts
    and agreements orupon making changes to the relevant legislativeand regulatory requirements. 4.1.3.2
    Cybersecurity managed service centers for monitoring and operations which use remote access shall
    be fully located in the Kingdom of Saudi Arabia.
  level: control
  source_page: null
  source_reference: >-
    NCA ECC 2:2024, Third-Party and Cloud Computing Cybersecurity / Third-Party Cybersecurity / 4-1-3

  statement: >-
    Cybersecurity requirements shall be included in the project management methodology and procedures
    and in the information and technology asset change management within the entity to ensure identifying
    and managing cybersecurity risks as part of the technology project lifecycle. The cybersecurity requirements
    shall be a key part of the requirements for technology projects. ‫ﻣﻘﻴﺪ‬ - -
  level: control
  source_page: null
  source_reference: >-
    NCA ECC 2:2024, Cybersecurity Governance / Cybersecurity in Information and Technology Project Management

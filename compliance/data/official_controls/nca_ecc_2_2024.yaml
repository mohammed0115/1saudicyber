  statement: >-
    The cybersecurity requirements for software and application development projects within the entity
    shall include the following as a minimum: 1.6.3.1 Using the secure coding standards. 1.6.3.2 Using
    trusted and licensed sources for software development tools and libraries. 1.6.3.3 Conducting compliance
    test for software against the cybersecurity requirements within the entity. 1.6.3.4 Secure integration
    between applications. 1.6.3.5 Reviewing secure configuration and hardening and updates packages before
    launching software products
  level: control
  source_page: null
  source_reference: >-
    NCA ECC 2:2024, Cybersecurity Governance / Cybersecurity in Information and Technology Project Management
    / 1-6-3

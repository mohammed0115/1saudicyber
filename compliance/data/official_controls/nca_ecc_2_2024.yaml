  domain: Cybersecurity Defense
  subdomain: Email Protection
  title: Cybersecurity requirements for protection of the email serviceofthe entity…
  statement: >-
    Cybersecurity requirements for protection of the email serviceofthe entity shall include the following
    as a minimum: 2.4.3.1 Analyzing and filtering email messages (specifically phishing emails and spam
    emails) using modern and advanced email protection techniques and mechanisms. 2.4.3.2 Multi-factor
    authentication, and defining the suitable authentication factors and their numbers as well as the
    suitable authentication techniques based on the result of impact assessment of authentication failure
    and bypass for remote and webmail access. 2.4.3.3 Email archiving and backup. 2.4.3.4 Secure management
    and protection against Advanced Persistent Threats (APT), which normally utilize zero-day malware
    and viruses. 2.4.3.5 Validation of the entity’s email service domains by using Sender Policy Framework
    (SPF), Domain Keys Identified Mail (DKIM), and Domain Message Authentication Reporting and Conformance
    (DMARC).
  level: control
  source_page: null
  source_reference: NCA ECC 2:2024, Cybersecurity Defense / Email Protection / 2-4-3

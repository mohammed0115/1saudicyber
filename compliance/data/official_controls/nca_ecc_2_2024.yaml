- control_id: 2-5-3
  external_reference: NCA ECC 2-5-3
  domain: Cybersecurity Defense
  subdomain: Networks Security Management
  title: Cybersecurity requirements for the entity’s network security management shall…
  statement: >-
    Cybersecurity requirements for the entity’s network security management shall include the following
    as a minimum: ‫ﻣﻘﻴﺪ‬ - - 2.5.3.1 Logical or physical isolation and segmentation of network segments
    in a secure manner which is required to control relevant cybersecurity risks, using firewall and defense-in-depth
    principle. 2.5.3.2 Isolation of production network from testing and development environment networks.
    2.5.3.3 Secure browsing and internet connectivity, including strict restrictions on suspicious websites,
    file storage/sharing websites, and remote access websites. 2.5.3.4 Wireless network security and protection
    using secure authentication and encryption techniques and avoiding the connection of wireless networks
    to the entity’s internal network, except after a comprehensive assessment of subsequent risks, with
    handling them in a way that protects the technology assets of the entity. 2.5.3.5 Restricting and
    managing network services, protocols, and ports. 2.5.3.6 Intrusion Prevention Systems (IPS). 2.5.3.7
    Security of Domain Name Service (DNS). 2.5.3.8 Secure management and protection of Internet browsing
    channel against Advanced Persistent Threats (APT), which normally utilize zero-day malware and viruses.
    2-5-3-9 Protecting against Distributed Denial of Service (DDoS) attacks to limit risks arising from
    these attacks.
  level: control
  source_page: null
  source_reference: NCA ECC 2:2024, Cybersecurity Defense / Networks Security Management / 2-5-3
  tags: []

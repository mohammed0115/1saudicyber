  domain: Third-Party and Cloud Computing Cybersecurity
  subdomain: Cloud Computing and Hosting Cybersecurity
  title: In accordance with the relevant legislative and regulatory requirements, and in…
  statement: >-
    In accordance with the relevant legislative and regulatory requirements, and in addition to the applicable
    controls in the Main Domains (1), (2), and (3) and Subdomain (4.1) that are necessary to protect the
    entity’s data or services provided thereto, cybersecurity requirements for use of cloud computing
    and hosting services shall include the following as a minimum: 4.2.3.1 Protection of entity’s data
    by cloud and hosting service providers in accordancewith its classificationleveland returningdata(in
    a usableformat) upon service completion. 4.2.3.2 Separation of the entity’s environment (especially
    virtual servers) from environments of other entities within the cloud computing service provider.
  level: control
  source_page: null

  domain: Cybersecurity Governance
  subdomain: Cybersecurity in Information and Technology Project Management
  title: The cybersecurity requirements for project management and information and…
  statement: >-
    The cybersecurity requirements for project management and information and technology asset changes
    within the entity shall include the following as a minimum: 1.6.2.1 Vulnerability assessment and remediation.
    1.6.2.2 Reviewing secure configuration and hardening and updates packages before launching projects
    and changes.
  level: control
  source_page: null
  source_reference: >-
    NCA ECC 2:2024, Cybersecurity Governance / Cybersecurity in Information and Technology Project Management
    / 1-6-2

  external_reference: NCA OSMACC 3-1-1
  domain: Third Party and Cloud Computing Cybersecurity
  subdomain: Third-Party Cybersecurity
  title: A need assessment for the use of social media management, automated monitoring…
  statement: >-
    A need assessment for the use of social media management, automated monitoring or brand protection
    services along with associcated cybersecurity risks must be conducted.
  level: control
  source_page: null
  source_reference: >-
    NCA Organizations' Social Media Accounts Cybersecurity Controls (OSMACC) 1:2021, Third Party and Cloud
    Computing Cybersecurity / Third-Party Cybersecurity / 3-1-1
  tags: []
- control_id: 3-1-2
  external_reference: NCA OSMACC 3-1-2
  domain: Third Party and Cloud Computing Cybersecurity
  subdomain: Third-Party Cybersecurity
  title: In addition to the subcontrols within control 4-1-2 in ECC, cybersecurity…
  statement: >-
    In addition to the subcontrols within control 4-1-2 in ECC, cybersecurity requirements for use of
    social media management, automated monitoring or brand protection services in the organization must
    include at least the following: 3-1-2-1 Non-disclosure clauses and secure removal of organization’s
    data by the third-party upon service termination. 3-1-2-2 Communication procedures to report vulnerabilities
    and cyber incidents. 3-1-2-3 Requirments for the third-party to comply with cybersecurity require-
    ments and policies to protect organizations’ social media accounts, and related laws and regulation.
    Third Party and Cloud Computing Cybersecurity Sharing Notice: White Document Classification: Open
    Appendices
  level: control
  source_page: null
  source_reference: >-
    NCA Organizations' Social Media Accounts Cybersecurity Controls (OSMACC) 1:2021, Third Party and Cloud
    Computing Cybersecurity / Third-Party Cybersecurity / 3-1-2

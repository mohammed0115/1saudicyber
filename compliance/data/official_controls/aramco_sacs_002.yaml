- control_id: TPC-53
  external_reference: SACS-002 TPC-53
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Third Party must encrypt (e.g.
  statement: >-
    Third Party must encrypt (e.g. using HTTPS) sessions where Critical Saudi Aramco information or data
    will be transmitted from and to the Public Cloud Computing Services, and enforce session authentication,
    lockout, and timeout.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-53
  tags: []
- control_id: TPC-54
  external_reference: SACS-002 TPC-54
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Third Party must implement encryption mechanisms, using at least AES encryption…
  statement: >-
    Third Party must implement encryption mechanisms, using at least AES encryption algorithm, and 256
    bit key, on all devices or storage media hosting sensitive data per the Third Party’s assets classification
    policy.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-54
  tags: []
- control_id: TPC-55
  external_reference: SACS-002 TPC-55
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Encryption key management capability, including preservation and retrieval,…
  statement: >-
    Encryption key management capability, including preservation and retrieval, must be defined, applied,
    and periodically reviewed.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-55
  tags: []
- control_id: TPC-56
  external_reference: SACS-002 TPC-56
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Third Party must implement a device control mechanism on Assets that are used…
  statement: >-
    Third Party must implement a device control mechanism on Assets that are used to receive, store, process
    or transmit Saudi Aramco data, such as disabling the use of external storage media.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-56
  tags: []
- control_id: TPC-57
  external_reference: SACS-002 TPC-57
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Access to the Internet must be restricted by Content-filtering technologies to…
  statement: >-
    Access to the Internet must be restricted by Content-filtering technologies to block: • Malicious
    and suspicious websites. • Personal and non-company email services. • Personal and non-company approved
    public cloud services.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-57
  tags: []
- control_id: TPC-58
  external_reference: SACS-002 TPC-58
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Documents containing Saudi Aramco Critical Data, must be encrypted and stored…
  statement: >-
    Documents containing Saudi Aramco Critical Data, must be encrypted and stored securely with access
    limited to authorized personnel.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-58
  tags: []
- control_id: TPC-59
  external_reference: SACS-002 TPC-59
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Remote wipe solution must be installed on all tablets and mobile phones used to…
  statement: >-
    Remote wipe solution must be installed on all tablets and mobile phones used to receive, store and/or
    produce critical data for Saudi Aramco.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-59
  tags: []
- control_id: TPC-60
  external_reference: SACS-002 TPC-60
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Third Party must implement data validation on all input fields for applications…
  statement: >-
    Third Party must implement data validation on all input fields for applications or Cloud Computing
    Services used by Saudi Aramco to only accept input with valid data type, syntax and length range.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-60
  tags: []
- control_id: TPC-61
  external_reference: SACS-002 TPC-61
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Application error messages must not display any sensitive technical information.
  statement: Application error messages must not display any sensitive technical information.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-61
  tags: []
- control_id: TPC-62
  external_reference: SACS-002 TPC-62
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Application or Cloud Computing Services must not store, generate, transmit, or…
  statement: >-
    Application or Cloud Computing Services must not store, generate, transmit, or use plain-text passwords.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-62
  tags: []
- control_id: TPC-63
  external_reference: SACS-002 TPC-63
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: >-
    Third Party must create and manage baseline configurations to harden information systems.
  statement: >-
    Third Party must create and manage baseline configurations to harden information systems. The hardening
    process must address configurations, such as: - Resetting default usernames/passwords - Disabling
    unneeded software - Disabling unneeded services - Removing administrative access of users on workstations
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-63
  tags: []
- control_id: TPC-64
  external_reference: SACS-002 TPC-64
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must establish and follow regular procedures for backup of critical…
  statement: >-
    Third Party must establish and follow regular procedures for backup of critical systems and Saudi
    Aramco’s data, software, and websites.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-64
  tags: []
- control_id: TPC-65
  external_reference: SACS-002 TPC-65
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Backup stored at an off-site location must be encrypted using at least AES…
  statement: >-
    Backup stored at an off-site location must be encrypted using at least AES encryption algorithm, and
    256 bit key, except for data classified as public.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-65
  tags: []
- control_id: TPC-66
  external_reference: SACS-002 TPC-66
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must implement a sanitization process before any assets are loaned,…
  statement: >-
    Third Party must implement a sanitization process before any assets are loaned, donated, destroyed,
    transferred, or surplused. The process must be aligned to industry best practices, such as NIST 800-88.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-66
  tags: []
- control_id: TPC-67
  external_reference: SACS-002 TPC-67
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must have a Disaster Recovery Plan (DR Plan), which is documented,…
  statement: >-
    Third Party must have a Disaster Recovery Plan (DR Plan), which is documented, maintained, and communicated
    to appropriate parties. The DR Plan should address the recovery of assets and communication following
    a major disruption to business operations.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-67
  tags: []
- control_id: TPC-68
  external_reference: SACS-002 TPC-68
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: The Third Party must have a comprehensive Business Continuity (BC) plan, which…
  statement: >-
    The Third Party must have a comprehensive Business Continuity (BC) plan, which is documented, maintained,
    and communicated to appropriate parties. The BC plan should address the occurrence of the following
    scenarios: a) Equipment failure b) Disruption of power supply or communication c) Application failure
    or corruption of database d) Human error, sabotage or strike e) Malicious Software attack f) Hacking
    or other Internet attacks g) Social unrest or terrorist attacks h) Environmental disasters i) Emergency
    contact information for personnel
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-68
  tags: []
- control_id: TPC-69
  external_reference: SACS-002 TPC-69
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: The Third Party must ensure that owners of the Business Continuity (BC) plan…
  statement: >-
    The Third Party must ensure that owners of the Business Continuity (BC) plan are identified, and that
    the BC plan is reviewed and updated annually.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-69
  tags: []
- control_id: TPC-70
  external_reference: SACS-002 TPC-70
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: The Third Party must conduct Business Continuity drills at least annually.
  statement: The Third Party must conduct Business Continuity drills at least annually.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-70
  tags: []
- control_id: TPC-71
  external_reference: SACS-002 TPC-71
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must have formal procedures for on-boarding employees.
  statement: >-
    Third Party must have formal procedures for on-boarding employees. On-boarding procedures must include
    background checks (e.g. Verification of work histories).
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-71
  tags: []
- control_id: TPC-72
  external_reference: SACS-002 TPC-72
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must conduct security and source-code vulnerability scanning on all…
  statement: >-
    Third Party must conduct security and source-code vulnerability scanning on all developed applications,
    and close all discovered vulnerabilities before deployment in production.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-72
  tags: []
- control_id: TPC-73
  external_reference: SACS-002 TPC-73
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: All changes to the application must be properly authorized, and tested in a…
  statement: >-
    All changes to the application must be properly authorized, and tested in a testing environment before
    moving to production.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-73
  tags: []
- control_id: TPC-74
  external_reference: SACS-002 TPC-74
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must have a process for secure system and software development life…
  statement: >-
    Third Party must have a process for secure system and software development life cycle in alignment
    with industry best practice.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-74
  tags: []
- control_id: TPC-75
  external_reference: SACS-002 TPC-75
  domain: PROTECT
  subdomain: Protective Technology (PT)
  title: Third Party must retain all audit logs from information systems and…
  statement: >-
    Third Party must retain all audit logs from information systems and applications storing, processing,
    or transmitting Saudi Aramco data for one (1) year.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Protective Technology (PT) / TPC-75
  tags: []
- control_id: TPC-76
  external_reference: SACS-002 TPC-76
  domain: PROTECT
  subdomain: Protective Technology (PT)
  title: Firewalls must be implemented at the network perimeter and only required…
  statement: >-
    Firewalls must be implemented at the network perimeter and only required services must be allowed.
    Vulnerable services or insecure protocols should be blocked.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Protective Technology (PT) / TPC-76
  tags: []
- control_id: TPC-77
  external_reference: SACS-002 TPC-77
  domain: PROTECT
  subdomain: Protective Technology (PT)
  title: Intrusion Detection Systems (IDS) or Intrusion Prevention Systems (IPS) must be…
  statement: >-
    Intrusion Detection Systems (IDS) or Intrusion Prevention Systems (IPS) must be implemented at the
    network perimeter.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Protective Technology (PT) / TPC-77
  tags: []
- control_id: TPC-78
  external_reference: SACS-002 TPC-78
  domain: PROTECT
  subdomain: Protective Technology (PT)
  title: Signatures of firewalls, IDS, and IPS must be up-to-date.
  statement: Signatures of firewalls, IDS, and IPS must be up-to-date.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Protective Technology (PT) / TPC-78
  tags: []
- control_id: TPC-79
  external_reference: SACS-002 TPC-79
  domain: PROTECT
  subdomain: Protective Technology (PT)
  title: If Third Party is hosting an application or a website for Saudi Aramco or…
  statement: >-
    If Third Party is hosting an application or a website for Saudi Aramco or providing cloud-based web
    application, Web Application Firewall (WAF) must be implemented to inspect all incoming traffic for
    potential threats and malicious activity e.g. SQL injection and Cross Site Scripting.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Protective Technology (PT) / TPC-79
  tags: []
- control_id: TPC-80
  external_reference: SACS-002 TPC-80
  domain: DETECT
  subdomain: Anomalies and Events (AE)
  title: Third Party must monitor technology assets, systems, and applications to…
  statement: >-
    Third Party must monitor technology assets, systems, and applications to identify unauthorized access,
    or unauthorized activity.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Anomalies and Events (AE) / TPC-80
  tags: []
- control_id: TPC-81
  external_reference: SACS-002 TPC-81
  domain: DETECT
  subdomain: Anomalies and Events (AE)
  title: Third Party must periodically aggregate and correlate data from multiple…
  statement: >-
    Third Party must periodically aggregate and correlate data from multiple systems and critical applications
    such as Firewalls, IDS/IPS, and anti-virus in a central repository for event monitoring and analysis
    purposes.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Anomalies and Events (AE) / TPC-81
  tags: []
- control_id: TPC-82
  external_reference: SACS-002 TPC-82
  domain: DETECT
  subdomain: Continuous Monitoring (CM)
  title: Multiple physical security measures must be implemented to prevent unauthorized…
  statement: >-
    Multiple physical security measures must be implemented to prevent unauthorized access to facilities.
    Entrances and exits must be secured with authentication card key, door locks, and monitored by video
    cameras.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Continuous Monitoring (CM) / TPC-82
  tags: []
- control_id: TPC-83
  external_reference: SACS-002 TPC-83
  domain: DETECT
  subdomain: Continuous Monitoring (CM)
  title: Privileged accounts activity must be logged and monitored on a regular basis.
  statement: Privileged accounts activity must be logged and monitored on a regular basis.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Continuous Monitoring (CM) / TPC-83
  tags: []
- control_id: TPC-84
  external_reference: SACS-002 TPC-84
  domain: DETECT
  subdomain: Continuous Monitoring (CM)
  title: Non-authorized devices (such as personal devices and mobile phones) must not be…
  statement: >-
    Non-authorized devices (such as personal devices and mobile phones) must not be used to store, process,
    or access assets.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Continuous Monitoring (CM) / TPC-84
  tags: []
- control_id: TPC-85
  external_reference: SACS-002 TPC-85
  domain: DETECT
  subdomain: Continuous Monitoring (CM)
  title: Monthly Vulnerability scans must be conducted to evaluate configuration,…
  statement: >-
    Monthly Vulnerability scans must be conducted to evaluate configuration, patches, and services for
    known vulnerabilities.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Continuous Monitoring (CM) / TPC-85
  tags: []
- control_id: TPC-86
  external_reference: SACS-002 TPC-86
  domain: DETECT
  subdomain: Continuous Monitoring (CM)
  title: Physical access to the facility where information systems reside must be…
  statement: >-
    Physical access to the facility where information systems reside must be restricted to authorized
    personnel and reviewed on a regular basis.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Continuous Monitoring (CM) / TPC-86
  tags: []
- control_id: TPC-87
  external_reference: SACS-002 TPC-87
  domain: DETECT
  subdomain: Continuous Monitoring (CM)
  title: Information systems and applications must log auditable events as stated in…
  statement: >-
    Information systems and applications must log auditable events as stated in SACS-002 Third Party Cybersecurity
    Standard Appendix C.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, DETECT / Continuous Monitoring (CM) / TPC-87
  tags: []

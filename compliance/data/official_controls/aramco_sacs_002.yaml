  external_reference: SACS-002 TPC-52
  domain: PROTECT
  subdomain: Data Security (DS)
  title: Third Party must encrypt data in transit (e.g., SSH, FTPS, HTTPS, TLS, IPSEC).
  statement: Third Party must encrypt data in transit (e.g., SSH, FTPS, HTTPS, TLS, IPSEC).
  level: control

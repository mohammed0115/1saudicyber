  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Data Security (DS) / TPC-17
  tags: []
- control_id: TPC-18
  external_reference: SACS-002 TPC-18
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Third Party must have formal procedures for off-boarding employees.
  statement: >-
    Third Party must have formal procedures for off-boarding employees. Off-boarding procedures must include
    the return of assets, and removal of all associated access.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-18
  tags: []
- control_id: TPC-19
  external_reference: SACS-002 TPC-19
  domain: PROTECT
  subdomain: Information Protection Processes and Procedures (IP)
  title: Assets used to process or store Saudi Aramco data and information must be…
  statement: >-
    Assets used to process or store Saudi Aramco data and information must be sanitized by the end of
    the data life cycle, or by the end of the retention period as stated in the contract, if defined.
    This includes all data copies such as backup copies created at any Third Party site(s). The sanitization
    must be conducted in alignment to industry best practices such as NIST 800-88. The Third party shall
    certify in a signed letter to Saudi Aramco that the data sanitization has been successfully completed.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Information Protection Processes and Procedures
    (IP) / TPC-19
  tags: []

  external_reference: SACS-002 TPC-20
  domain: PROTECT
  subdomain: Protective Technology (PT)
  title: The Third Party must obtain a Cybersecurity Compliance Certificate (CCC) from…
  statement: >-
    The Third Party must obtain a Cybersecurity Compliance Certificate (CCC) from Saudi Aramco authorized
    audit firms in accordance to the third-Party classification requirements set forth in this Standard
    (Section II). Third Parties must submit the CCC to Saudi Aramco through the Saudi Aramco e-Marketplace
    system.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Protective Technology (PT) / TPC-20

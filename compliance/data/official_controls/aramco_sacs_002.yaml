  external_reference: SACS-002 TPC-88
  domain: RESPOND
  subdomain: Communications (CO)
  title: Incident management policy and plan must be documented, maintained, and…
  statement: >-
    Incident management policy and plan must be documented, maintained, and communicated to management
    and appropriate team members.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, RESPOND / Communications (CO) / TPC-88
  tags: []
- control_id: TPC-89
  external_reference: SACS-002 TPC-89
  domain: RESPOND
  subdomain: Analysis (AN)
  title: Third Party must have an incident response capability that includes…
  statement: >-
    Third Party must have an incident response capability that includes preparation, detection and analysis,
    containment, eradication, recovery, documentation and preservation of evidence, communication protocols,
    and lessons learned.
  level: control
  source_reference: SACS-002 Third Party Cybersecurity Standard, RESPOND / Analysis (AN) / TPC-89
  tags: []
- control_id: TPC-90
  external_reference: SACS-002 TPC-90
  domain: RESPOND
  subdomain: Analysis (AN)
  title: The Third Party must track, classify, and document all cybersecurity Incidents.
  statement: The Third Party must track, classify, and document all cybersecurity Incidents.
  level: control
  source_reference: SACS-002 Third Party Cybersecurity Standard, RESPOND / Analysis (AN) / TPC-90
  tags: []
- control_id: TPC-91
  external_reference: SACS-002 TPC-91
  domain: RESPOND
  subdomain: Mitigation (MI)
  title: Third Party must resolve or mitigate the identified security Vulnerabilities on…
  statement: >-
    Third Party must resolve or mitigate the identified security Vulnerabilities on a system, computer,
    network, or other computer equipment within the following timeframes: - Critical Risk: immediate correction
    up to fourteen (14) calendar days of critical vendor patch release, notification from Saudi Aramco,
    or discovered security breach whichever is earlier. - High Risk: within one (1) month of vendor patch
    release, or discovered security breach whichever is earlier. Medium and Low Risk: within three (3)
    months of discovery.
  level: control
  source_reference: SACS-002 Third Party Cybersecurity Standard, RESPOND / Mitigation (MI) / TPC-91
  tags: []
- control_id: TPC-92
  external_reference: SACS-002 TPC-92
  domain: RESPOND
  subdomain: Mitigation (MI)
  title: If Third Party is hosting a website for Saudi Aramco or providing a Cloud…
  statement: >-
    If Third Party is hosting a website for Saudi Aramco or providing a Cloud Computing Service, the website
    / Cloud Computing Service must be secured by a Distributed Denial of Service (DDOS) protection.
  level: control
  source_reference: SACS-002 Third Party Cybersecurity Standard, RESPOND / Mitigation (MI) / TPC-92
  tags: []

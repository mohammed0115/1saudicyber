  title: If the Third Party discovers a cybersecurity incident, the Third Party must…
  statement: >-
    If the Third Party discovers a cybersecurity incident, the Third Party must (besides its continuous
    efforts to resolve and mitigate the Incident): - Notify SAUDI ARAMCO within 24 hours of discovering
    the incident - Follow the Cybersecurity Incident Response Instructions set forth in Appendix A.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, RESPOND / Communications (CO) / TPC-23

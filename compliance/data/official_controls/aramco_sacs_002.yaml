# CyberTrust KSA — Official control dataset (Phase 2F/2G)
# Source of truth: Aramco SACS-002 (NOT the legacy 334 Excel).
framework_version_code: ARAMCO-SACS-002
source_document_title: Saudi Aramco SACS-002 Third Party Cybersecurity Standard
expected_control_count: 92
notes: >-
  Statements transcribed from the official Aramco Third Party Cybersecurity Compliance Report Template.
  TPC-62 (absent from that template) was verified and added from the SACS-002 standard PDF and the Cybersecurity
  Controls Requirements Guideline. Domain/subdomain mapped from SACS-002 section headers. NOT derived
  from the legacy 334 Excel.
controls:
- control_id: TPC-1
  external_reference: SACS-002 TPC-1
  domain: IDENTIFY
  subdomain: Governance (GV)
  title: The Third Party must establish, maintain, and communicate a Cybersecurity…
  statement: >-
    The Third Party must establish, maintain, and communicate a Cybersecurity Acceptable Use Policy (AUP)
    governing the use of Third Party Technology Assets.
  level: control
  source_reference: SACS-002 Third Party Cybersecurity Standard, IDENTIFY / Governance (GV) / TPC-1
  tags: []
- control_id: TPC-2
  external_reference: SACS-002 TPC-2
  domain: PROTECT
  subdomain: Access Control (AC)
  title: Password protection measures must be enforced by the Third Party.
  statement: >-
    Password protection measures must be enforced by the Third Party. The following are recommended measures:
    - Minimum length: eight alphanumeric characters and special characters - History: last 12 passwords
    - Maximum age: 90 days for login authentication - Account lockout threshold: 10 invalid login attempts
    - Screen saver settings: automatically locked within five minutes of inactivity
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Access Control (AC) / TPC-2
  tags: []
- control_id: TPC-3
  external_reference: SACS-002 TPC-3
  domain: PROTECT
  subdomain: Access Control (AC)
  title: Third party must not write down, electronically store in clear text, or…
  statement: >-
    Third party must not write down, electronically store in clear text, or disclose any password or authentication
    code that is used to access Assets or Critical Facilities. This should be part of Third Party cybersecurity
    polices.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Access Control (AC) / TPC-3
  tags: []
- control_id: TPC-4
  external_reference: SACS-002 TPC-4
  domain: PROTECT
  subdomain: Access Control (AC)
  title: Two-Factor authentication must be enforced on all remote access, including…
  statement: >-
    Two-Factor authentication must be enforced on all remote access, including access from the Internet,
    to Third Party Company computing resources.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Access Control (AC) / TPC-4
  tags: []
- control_id: TPC-5
  external_reference: SACS-002 TPC-5
  domain: PROTECT
  subdomain: Access Control (AC)
  title: Multi-factor authentication must be enforced on all access to Cloud services…
  statement: >-
    Multi-factor authentication must be enforced on all access to Cloud services utilized by the Third
    Party, including access to cloud-based email.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Access Control (AC) / TPC-5
  tags: []
- control_id: TPC-6
  external_reference: SACS-002 TPC-6
  domain: PROTECT
  subdomain: Access Control (AC)
  title: The Third Party must inform Saudi Aramco when employees provided with Saudi…
  statement: >-
    The Third Party must inform Saudi Aramco when employees provided with Saudi Aramco user credentials
    no longer need their access, or are transferred, reassigned, have retired, or resigned, or no longer
    associated with the Third Party.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Access Control (AC) / TPC-6
  tags: []
- control_id: TPC-7
  external_reference: SACS-002 TPC-7
  domain: PROTECT
  subdomain: Awareness and Training (AT)
  title: The Third Party must require all information systems users to take annual…
  statement: >-
    The Third Party must require all information systems users to take annual mandatory cybersecurity
    training that addresses acceptable use and good computing practices. Training must address the following
    topics: 1. Internet and social media security 2. Cybersecurity acceptable use 3. Social engineering
    and phishing emails 4. Sharing credentials (i.e., username and password) 5. Data security
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Awareness and Training (AT) / TPC-7
  tags: []
- control_id: TPC-8
  external_reference: SACS-002 TPC-8
  domain: PROTECT
  subdomain: Awareness and Training (AT)
  title: The Third Party must inform personnel, in keeping with the Third Party Company…
  statement: >-
    The Third Party must inform personnel, in keeping with the Third Party Company Policy, that using
    personal email to share and transmit Saudi Aramco data is strictly prohibited.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Awareness and Training (AT) / TPC-8
  tags: []
- control_id: TPC-9
  external_reference: SACS-002 TPC-9
  domain: PROTECT
  subdomain: Awareness and Training (AT)
  title: The Third Party must inform personnel, in keeping with the Third Party Company…
  statement: >-
    The Third Party must inform personnel, in keeping with the Third Party Company Policy, that disclosing
    Saudi Aramco policies, procedures, and standards, or any type of data with unauthorized entities or
    on the Internet, is strictly prohibited.
  level: control
  source_reference: >-
    SACS-002 Third Party Cybersecurity Standard, PROTECT / Awareness and Training (AT) / TPC-9
  tags: []

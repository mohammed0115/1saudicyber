- control_id: 2-2-P-1
  external_reference: NCA CCC 2-2-P-1
  domain: Cybersecurity Defense
  subdomain: Identity and Access Management
  title: In addition to Subcontrols in the ECC control 2-2-3, the CSP shall cover the…
  statement: >-
    In addition to Subcontrols in the ECC control 2-2-3, the CSP shall cover the following additional
    Subcontrols for cybersecurity requirements for identity and access management requirements, as a minimum:
    2-2-P-1-1 Identity and access management of generic accounts credentials for accountability cannot
    be assigned for a specific individual. 2-2-P-1-2 Secure session management, including session authenticity,
    session lockout, and session timeout termination. 2-2-P-1-3 Multi-factor authentication for privileged
    users, and candidates of personnel with access to Cloud Technology Stack. 2-2-P-1-4 Formal process
    to detect and prevent unauthorized access (e.g., unsuccessful login attempt threshold). 2-2-P-1-5
    Utilizing secure methods and algorithms for saving and processing passwords, such as: Secure Hashing
    functions. - 2-2-P-1-6 Secure management of third- party personnel’s accounts. 2-2-P-1-7 Access control
    enforced to management systems, administrative consoles. 2-2-P-1-8 Masking of displayed authentication
    inputs, especially passwords, to prevent shoulder surfing. 2-2-P-1-9 Getting CST’s approval before
    accessing any CST-related asset by the CSP or CSP’s third parties. 2-2-P-1-10 Capability to immediately
    interrupt a remote access session and prevent any future access for a user. 2-2-P-1-11 Provision to
    CSTs of multi-factor authentication services for privileged cloud users. 2-2-P-1-12 Assurance of restricted
    and controlled access to storage systems and means (such as Storage Area Network (SAN)). ✔2 ✔3 ✔ ✔
  level: control
  source_page: null
  source_reference: NCA CCC 2:2024, Cybersecurity Defense / CSP (Cloud Service Provider) / 2-2-P-1
  tags: []
- control_id: 2-2-T-1
  external_reference: NCA CCC 2-2-T-1
  domain: Cybersecurity Defense
  subdomain: Identity and Access Management
  title: In addition to Subcontrols in the ECC control 2-2-3, the CST shall cover the…
  statement: >-
    In addition to Subcontrols in the ECC control 2-2-3, the CST shall cover the following additional
    Subcontrols for cybersecurity requirements for identity and access management requirements, as a minimum:
    2-2-T-1-1 Identity and access management for all cloud credentials along their full lifecycle. 2-2-T-1-2
    Confidentiality of cloud user identification, cloud credential and cloud access rights information,
    including the requirement on users to keep them private (for employed, third party and CST personnel).
    2-2-T-1-3 Secure session management, including session authenticity, session lockout, and session
    timeout termination on the cloud. 2-2-T-1-4 Multi-factor authentication for privileged cloud users.
    2-2-T-1-5 Formal process to detectandpreventunauthorized access tocloud(such as a threshold of unsuccessful
    login attempts). ✔9 ✔ ✔ ✔
  level: control
  source_page: null
  source_reference: NCA CCC 2:2024, Cybersecurity Defense / CST (Cloud Service Tenant) / 2-2-T-1
  tags: []
- control_id: 2-3-P-1
  external_reference: NCA CCC 2-3-P-1
  domain: Cybersecurity Defense
  subdomain: Information System and Information Processing Facilities Protection
  title: In addition to Subcontrols in the ECC control 2-3-3, the CSP shall cover the…
  statement: >-
    In addition to Subcontrols in the ECC control 2-3-3, the CSP shall cover the following additional
    Subcontrols for cybersecurity requirements for information system and processing facilities protection
    requirements, as a minimum: 2-3-P-1-1 Ensuring that all configurations are applied in accordance with
    CSP’s cybersecurity standards. 2-3-P-1-2 Assurance of separation and isolation of data, environments,
    and information systems across CSTs, to prevent data commingling. 2-3-P-1-3 Adopting cybersecurity
    principles for technical system configurations adhering to the minimum functionality principle. 2-3-P-1-4
    Ability of the Cloud Technology Stacks to securely handle input validation, exceptions and failure.
    - 2-3-P-1-5 Full isolation of security functions and applications from other functions and applications
    in the Cloud Technology Stack. 2-3-P-1-6 Notification to CSTs with cybersecurity requirements provided
    by the CSP that are useable by the CST. 2-3-P-1-7 Detection and prevention of unauthorized changes
    to software programs, and systems. 2-3-P-1-8 Complete isolation and protection of multiple guest environments.
    2-3-P-1-9 The community cloud services provided to CSTs (government entities and CNI entities) shall
    be isolated from any other cloud computing provided to entities outside the scope of work. 2-3-P-1-10
    Modern technologies, such as Endpoint Detection and Response (EDR) technologies, toensurethattheinformationservers
    anddevicesofCSP’s information processing systems and devices of are ready for rapid response to incidents.
    ✔ ✔ ✔ ✔
  level: control
  source_page: null
  source_reference: NCA CCC 2:2024, Cybersecurity Defense / CSP (Cloud Service Provider) / 2-3-P-1

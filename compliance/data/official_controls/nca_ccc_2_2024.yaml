framework_version_code: NCA-CCC-2-2024
source_document_title: NCA Cloud Cybersecurity Controls (CCC) 2:2024
expected_control_count: 55
notes: >-
  Controls extracted from the official NCA CCC 2:2024 PDF (pdftotext -raw). CCC uses a party-specific
  id scheme d-d-P-d (Cloud Service Provider) and d-d-T-d (Cloud Service Tenant). RECONCILIATION: the PDF
  declares 37 Main Controls for CSPs and 18 Main Controls for CSTs; the dataset therefore holds 37 + 18
  = 55 controls (the "~37" in the earlier strategy referred to the CSP set only). The d-d-d numbers appearing
  inside statements are references to ECC controls, not CCC ids, and are excluded. NOT derived from the
  legacy 334 Excel.

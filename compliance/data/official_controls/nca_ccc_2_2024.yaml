  title: In addition to Subcontrols in the ECC control 2-7-3, the CSP shall cover the…
  statement: >-
    In addition to Subcontrols in the ECC control 2-7-3, the CSP shall cover the following additional
    Subcontrols for cybersecurity requirements for data and information protection requirements, as a
    minimum: 2-6-P-1-1 Prohibiting the use of Cloud Technology Stack’s data in any environment other than
    production environment, except after applying strict controls for protecting that data, such as data
    masking or data scrambling techniques. 2-6-P-1-2 Provision to CSTs of securely data storage processes,
    procedures, and technologies to comply with related legal and regulatory requirements. 2-6-P-1-3 Disposal
    of CST’s data should be performed in a secure manner on termination or expiry of the contract with
    the CSP. 2-6-P-1-4 Commitment to maintain the confidentiality of the CST’s data and information, according
    to related legal and regulatory requirements. - 2-6-P-1-5 Providing CSTs with secure means to export
    and transfer data and virtual infrastructure. ✔5 ✔ ✔ ✔

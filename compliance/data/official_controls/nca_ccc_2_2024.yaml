  title: In addition to subcontrols in the ECC control 3-1-3, the CST shall cover the…
  statement: >-
    In addition to subcontrols in the ECC control 3-1-3, the CST shall cover the following additional
    subcontrols for cybersecurity requirements for cybersecurity resilience aspects of business continuity
    management, as a minimum: 3-1-T-1-1 Developingandimplementingdisaster recoveryand businesscontinuity
    procedures related to cloud computing, in a secure manner. - Third-Party Cybersecurity - Annex No.
    (B): Terminologies and Definitions Annex B below shows some of the terminologies contained herein,
    and the meanings ascribed thereto. Terminology Definition Asset Anything tangible or intangible that
    has valueto the CSPsand CSTs. There are many types of assets, and some of which include obvious things,
    such as: persons, machineries, utilities, patents, software, and services. The term could also include
    less obvious things, such as: information and characteristics(for example, CSPs’ and CSTs’ reputation
    and public image, as well as skill and knowledge). Attack Any kind of malicious activity that attempts
    to achieve unauthorized access, collection, disabling, prevention, destroy or sabotage of the information
    system resources or the information itself. Audit Independent review and examination of records and
    activities in order to assess the effectiveness of cybersecurity controls and to ensure adherence
    to policies, operational procedures, standards, and relevant legislative and regulatory requirements.
    Authentication Ensure user's identity, process, or device, which is often a prerequisite for allowing
    access to resources in the system. Authorization Identification and verification of the rights/licenses
    of the user to access and allow him/her to view the information and technical resources of the CSPs
    and CSTs as defined in the rights/user licenses. Availability Ensure timely access to information,
    data, systems, and applications. Backup Files, devices, data, and procedures available for use in
    case of failure or loss, or in case of deletion or suspension of their original copies. Closed-Circuit
    Television (CCTV) CCTV, also known as video surveillance, uses video cameras to send a signal to a
    specific location on a limited set of screens. This term is often referred to as the surveillance
    technique in areas that may need to be monitored where physical security is an important requirement
    thereto. Change Management It is a service management system that ensures a systematic and proactive
    approach using effective standard methods and procedures (for example, change in infrastructure, networks,
    etc.). Change Management helps all stakeholders, including individuals and teams alike, move from
    their current state to the next desired state, and also helps reduce the impact of relevant incidents
    on service. Classification Categorizing the data prepared, collected, processed, or exchanged by the
    entities for the provision of services or conduct of businesses, including data received fromor exchanged
    with persons outsideentities, and thedata that is prepared for the interest of entities or related
    to the sensitive - Terminology Definition infrastructure. Data related to entities is classified,
    using a top-down approach, level 1, level 2, level 3, or level 4. Classified Data Any data classified
    at any of the following levels: level 1, level 2, level 3, or level 4. Cloud Computing Is a model
    which enables convenient, on-demand network access to a shared pool of configurable computing resources
    (e.g., networks, servers, storage, applications, and services) that can be rapidly provisioned and
    released with minimal management effort or service provider interaction. Cloud models are composed
    of five Essential Characteristics: On-demand self-service, Broad network access, Resource pooling,
    Rapid elasticity, and Measured service. There are three types of cloud computing services delivery
    models: • Cloud Software as a Service (SaaS). • Cloud Platform as a Service (PaaS). • Cloud Infrastructure
    as a Service (IaaS). There are four deployment models: Private Cloud, Community Cloud, Public Cloud,
    and Hybrid Cloud. Cloud Computing Compliance Control Catalogue (C5) C5 is developed by the German
    Federal Office for Information Security (BSI) to set minimum requirements to secure cloud services
    in order to establish a framework of trust between cloud providers and their customers. Cloud Computing
    Services Is the delivery of various services via the Internet and can be accessible through different
    platforms (desktops, laptops, smart phones, etc.). These services include applications and infrastructures
    such as servers, databases, and networking to support, among other things, communication, data analysis,
    processing, sharing and storage. Matrix (CCM) CCM is developed by the Cloud Security Alliance (CSA)
    to provide fundamental security principles to help the CSTs assessing the security risks of cloud
    services provided by the CSP. Cloud Customer In this document referred to as “Cloud Service Tenant
    (CST),” is any natural or legal person (such as companies) who subscribes to the cloud computing services
    provided by the service provider. Cloud Service Provider (CSP) Any natural or legal person (such as
    companies) who provides cloud computing services to the public, either directly or indirectly through
    data centers (bothinside and outside the Kingdom)and manages themin whole or in part. Configuration
    Management DataBase (CMDB) Configuration Management DataBase, concept defined originally by the ITIL
    operations standard and consisting in database used to store configuration records of systems throughout
    their Lifecycle. - Terminology Definition Cloud Technology Stack (CTS) Layered architecture of technologies
    that are essential to implement cloud computing services: (Data Center infrastructure, LAN, storage/
    compute/ hyper convergence hardware, hypervisor, cloud management platform, virtual appliances, OSs,
    application software, O&M platforms, cloud security technologies etc.…) Compromise Disclosure oforobtaininginformationbyunauthorized
    persons, which are unauthorized to be leaked or obtained, or violation of the cybersecurity policy
    of the Entity through disclosure, change, sabotage, or loss of anything, either intentionally or unintentionally.
    The expression "security violation" means disclosure of, obtaining, leaking, altering or use of sensitive
    data without authorization (including cryptographic keys and other critical cybersecurity standards).
    Confidentiality Maintaining authorized restrictions on access to and disclosure of information, including
    means of protecting privacy/personal information. Confidential Data/Information The information (or
    data) that is highly sensitive and important, according to the classification of the CSPs and CSTs,
    intended for use by them. One of the methods that can be used to classify this type of information
    is to measure the extent of the damage when it is disclosed, accessed in an unauthorized manner, damaged
    or sabotaged, as this mayresultinmaterial or moral damage to the CSPs and CSTs or its clients, affecting
    the lives of persons related to that information or affecting and damaging the security of the state
    or its national economy or national capabilities. Sensitive information includes all information whose
    disclosure in unauthorized manner, loss or sabotage results in accountability or statutory penalties.
    Critical National Infrastructure (CNI) These are the assets (i.e., facilities, systems, networks,
    processes, and key operators who operate and process them), whose loss or vulnerability to security
    breaches may result in:  Significant negative impact on the availability, integration, or delivery
    of basic services, including services that could result in serious loss of property and/orlives and/or
    injuries, alongside observance of significant economic and/or social impacts.  Significant impact
    on national security and/or national defense and/or state economy or national capacities. Cryptography
    These are the rules that include the principles, methods and means of storing and transmitting data
    or information in a particular form in order to conceal its semantic content, prevent unauthorized
    use or prevent undetected modification so that only the persons concerned can read and process the
    same. - Terminology Definition Cyber-Attack Intentional exploitation of computer systems and networks,
    and those CSPs and CSTs whose work depends on digital ICT, in order to cause damage. Cyber Risks Risks
    that harm the CSPs’ and CSTs’ processes (including the CSPs’ and CSTs’ vision, mission, management,
    image, or reputation), assets, individuals, other entities, or the State due to unauthorized access,
    use, disclosure, disruption, modification or destruction of information and/or information systems.
    Cybersecurity Resilience Overall ability of the CSPs and CSTs to withstand cyber incidents and the
    causes of damage, and recovery therefrom. Cybersecurity Pursuant to the provisions of NCA's Regulation
    issued by virtue of the Royal Decree No. (6801) of (11/02/1439), cybersecurity is protection of networks,
    IT systems, operational technologies systems and their components of hardware and software, their
    services and the data they contain, from any penetration, disruption, modification, access, use or
    unauthorized exploitation. The concept of cybersecurity also includes information security, digital
    security, etc. Cyberspace The interconnected network of IT infrastructure, including the Internet,
    communications networks, computer systems and Internet-connected devices, as well as the associated
    hardware and control devices. The term can also refer to a virtual world or domain such as a simple
    concept. Data Any information, records, statistics, or documents that are photocopied, recorded, and
    stored electronically. Data and Information Classification Setting the sensitivity level of data and
    information that results in security controls for each level of classification. Data and information
    sensitivity levels are set according to predefined categories where data and information is created,
    modified, improved, stored, or transmitted. The classification level is an indication of the value
    or importance of the data and information of the Entity. Defense-in-Depth This is a concept of informationassurance
    where multiple levels of security controls are used (as a defense) within the IT/OT system. Disaster
    Recovery Programs and plans designed to restore the Entity’s critical business functions and services
    to an acceptable situation, following exposure to cyber-attacks or disruption of such services. Effectiveness
    Effectiveness refers to the degree to which a planned impact is achieved. Planned activities are considered
    effective if these activities are already implemented, and the planned results are considered effective
    if the results are already achieved. KPIs can be used to measure and evaluate the level of effectiveness.
    - Terminology Definition Event Something that happens in a specific place (such as network, systems,
    applications, etc.) at a specific time. FedRAMP US Government assessment and authorization process
    for U.S. federal agencies designed to ensure security is in place when accessing cloud computing products
    and services. FedRAMP certifies cloud service providers to handle data in one of three impact levels:
    ● FedRAMP Low - loss of confidentiality, integrity, and availability would result in limited adverse
    effects on an agency’s operations, assets, or individuals. ● FedRAMP Moderate - loss of confidentiality,
    integrity, and availability would result in serious adverse effects on an agency’s operations, assets,
    or individuals. ● FedRAMP High - Law Enforcement and Emergency Services systems, Financial systems,
    Health systems, and any other system where loss of confidentiality, integrity, or availability could
    be expected to have a severe or catastrophic adverse effect on entity-related operations, entity-
    related assets, or individuals. Identification A means for identification of the identity of the user,
    process, or device, which is usually a prerequisite for granting access to resources in the system.
    Incident A security breach through violation of cybersecurity policies, acceptable use policies, practices
    or cybersecurity controls or requirements. Integrity Protection against unauthorized modification
    or destruction of information, including ensuring information non-repudiation and reliability. (Inter)National
    Requirements The international requirements are requirements developed by an international entity
    or entity, which are highly-used in a statutory manner all over the world (such as: PCI, SWIFT, etc.).
    The national requirements are requirements developed by a regulatory entity within the Kingdom for
    statutory use (such as: the "ECC – 1: 2018"). ISO/IEC 27000 This series developed by the International
    Organization for Standardization (ISO) and the International Electrotechnical Commission (IEC) to
    provide best practice recommendations to establish, implement, maintain, and continually improve information
    security management system (ISMS). Key Performance Indicator (KPI) A type of performance measurement
    tool that assesses the success of an activity or entity towards achievement of specific objectives.
    - Terminology Definition Labelling Display of information (by specific and standard naming and coding)
    that is placed on the CSPs’ and CSTs’ assets (such as devices, applications, documents, etc.) to be
    used to refer to some information related to the classification, ownership, type, and other asset
    management information. Level 1 A classification level applies to data classified as a (top secret)
    based on what is issued by the competent entity. Level 2 A classification level applies to data classified
    as a (secret) based on what is issued by the competent entity. Level 3 A classification level applies
    to data classified as a (confidential) based on what is issued by the competent entity. Level 4 A
    classification level applies to data classified as a (public) based on what is issued by the competent
    entity. Multi-Factor Authentication (MFA) A security system that verifies user identity, which requires
    the use of several separate elements of identity verification mechanisms. Verification mechanisms
    include several elements:  Knowledge: (something ONLY the user knows "like password");  Possession:
    (something ONLY used by the user "such as a program or device generating random numbers or SMSs for
    login records, which are called: One-Time-Password); and  Inherent Characteristics: (a characteristic
    of the user ONLY, such as fingerprint). Multi-Tier Cloud Security Standard for Singapore (MTCS SS)
    This standard aims to encourage the adoption of sound risk management and security practices for cloud
    computing. MTCS SS has three levels of security, Level 1 being the base and Level 3 being the most
    stringent:  Level 1 – Designed for non-business critical data and systems, with baseline security
    controls to address security risks and threats in potentially low impact information systems using
    cloud services.  Level 2 – Designed to address the need of most entities running critical data and
    systems through a set of more stringent security controls. These address security risks and threats
    in potentially moderate impact information systems using cloud service.  Level 3 – Designed for regulated
    entities with specific requirements, which supplement or address security risks and threats in high
    impact information systems using cloud services. Staff Persons working withCSPs or CSTs (including
    official and temporary staff and contractors). - Terminology Definition Outsourcing Obtaining (goods
    or services) by contracting with a supplier or service provider. Penetration Testing Testing a computer
    system, network, website application or smart phone application to look for the vulnerabilities that
    the attacker can exploit. Physical Security Physical security describes security measures designed
    to prevent unauthorized access to the entity’s facilities, equipment, and resources, and to protect
    individuals and property from damage or harm (such as espionage, theft, or terrorist attacks). Physical
    security involves the use of multiple-tier of interconnected systems, including CCTV, security guards,
    security limits, locks, access control systems and many other technologies. Policy A document whose
    clauses specify a general obligation, direction or intent as formally expressed by the Authorizing
    Official of the entity. Cybersecurity Policy is a document whose clauses reflect official commitment
    of the Senior Management to implement and improve the cybersecurity program in the entity, which includes
    the objectives of the CSPs and CSTs regarding the cybersecurity program, its controls and requirements,
    and the mechanism for improving and developing the same. Privileged Access Management The process
    of managing high-risk powers on entity’s systems, which often require special treatment to minimize
    risks that may arise from misuse thereof. Procedure A document with a detailed description of the
    steps necessary to perform specific operations or activities in compliance with relevant standards
    and policies. Procedures are defined as part of operations. Process A set of interrelated or interactive
    activities that translated input into output. Such activities are influenced by the policies of the
    CSPs and CSTs. RACI Matrix Responsible, Accountable, Consulted, Informed Matrix. Matrix that maps
    each player in a process, capability, or function with the degree of involvement and responsibility
    undertaken in the process. Recovery A procedure or process to restore or control something that is
    suspended, damaged, stolen or lost. Security Information and Event Management (SIEM) A system that
    manages and analyses security events logs in real time in order to provide monitoring of threats,
    analysis of the results of interrelated rules for event logs and reports on logs data, and incident
    response. System Development Security Any application, platform, middleware, operating system, hypervisor,
    network stack and any other software that is part of the Cloud Technology Stack. Third-Party Any entity
    acting as a party in a contractual relationship to provide goods or services (this includes suppliers
    and service providers). - Terminology Definition Threat Any circumstance or events likely to adversely
    affect the business of the CSPs and CSTs (including itsmission, functions,credibility or reputation),
    assets or employees, through exploiting an information system through unauthorized access to, destruction,
    disclosure, alteration or denial of services, in addition to the ability of the threat source to succeed
    in exploiting one of the vulnerabilities of a particular information system, which includes cyber
    threats. Vulnerability Any kind of vulnerability in the computer system, its programs, or applications,
    in a set of procedures or anything that makes cybersecurity vulnerable. - Annex No. (C): List of the
    Abbreviations Annex C below shows some of the abbreviations, and their meanings, used in the controls
    herein. Abb. Full Version BCM Business Continuity Management CCTV Closed-Circuit Television CMDB Configuration
    Management DataBase CNI Critical National Infrastructure CSP Cloud Service Provider CST Cloud Service
    Tenant CTS Cloud Technology Stack DDoS Distributed Denial of Service IaaS Infrastructure as a Service
    MFA Multi-Factor Authentication PaaS Platform as a Service SAN Storage Area Network SaaS Software
    as a Service SIEM Security Information and Event Management - Annex No. (D): List of the Updates Annex

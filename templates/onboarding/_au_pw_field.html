{% load i18n %}
{# Light (.au) password field with an accessible show/hide toggle (wired by auth_base.html JS). #}
<div class="au-field">
  <label{% if field.id_for_label %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}{% if req %} <span class="au-req">*</span>{% endif %}</label>
  <div class="au-pw-wrap">
    {{ field }}
    <button type="button" class="au-pw-toggle" data-pw-toggle="{{ field.id_for_label }}"
            aria-pressed="false" aria-label="{% trans 'إظهار كلمة المرور' %}"
            data-label-show="{% trans 'إظهار كلمة المرور' %}" data-label-hide="{% trans 'إخفاء كلمة المرور' %}">
      <i class="fas fa-eye" aria-hidden="true"></i>
    </button>
  </div>
  {% if field.help_text %}<div class="au-help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="au-err"><i class="fas fa-circle-exclamation" aria-hidden="true"></i><span>{{ field.errors|striptags }}</span></div>{% endif %}
</div>

<style>
  .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:48px 16px;font-family:'Inter','Noto Sans Arabic',sans-serif;}
  .auth-card{width:100%;max-width:26rem;background:#fff;border:1px solid #D8E1DD;border-radius:1rem;
    padding:2rem;box-shadow:0 12px 40px rgba(15,41,33,0.14);}
  .auth-card input[type=text],.auth-card input[type=email],.auth-card input[type=password]{
    width:100%;box-sizing:border-box;border:1px solid #D8E1DD;border-radius:.6rem;padding:.7rem .85rem;
    font-size:.95rem;color:#1F2933;background:#fff;font-family:inherit;}
  .auth-card input:focus{outline:none;border-color:#0F5D46;box-shadow:0 0 0 3px rgba(15,93,70,.12);}
  /* Errored fields (via .field-error wrapper or aria-invalid) show a red border. */
  .auth-card .field-error input,.auth-card input[aria-invalid="true"]{
    border-color:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.10);}
  .auth-card .field-error input:focus,.auth-card input[aria-invalid="true"]:focus{
    box-shadow:0 0 0 3px rgba(220,38,38,.18);}
  /* Room for the show/hide-password toggle inside the field. */
  .auth-card .pw-wrap input{padding-inline-end:2.5rem;}
  .auth-card label{display:block;font-size:.85rem;font-weight:600;color:#374151;margin-bottom:.35rem;}
  .auth-card ul{margin:.25rem 0 0;padding-inline-start:1.1rem;}
  .auth-btn{width:100%;background:#1a4731;color:#fff;font-weight:700;border:none;border-radius:.6rem;
    padding:.8rem;font-size:1rem;cursor:pointer;transition:background .15s;}
  .auth-btn:hover{background:#15302a;}   /* darken on hover (was lightening to #15803d) */
  .auth-card ul#pw-rules{padding-inline-start:0;list-style:none;}
</style>

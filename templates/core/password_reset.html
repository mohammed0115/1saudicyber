{% extends "base.html" %}{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl p-6 shadow-sm border border-gov-gray-100 space-y-4">
  <h1 class="text-xl font-bold text-gov-green-800">Reset your password</h1>
  <p class="text-sm text-gov-gray-600">Enter your email and we'll send a reset link.</p>
  <form method="post" class="space-y-3">{% csrf_token %}{{ form.as_p }}
    <button class="w-full bg-gov-green-800 text-white rounded-lg py-2 font-semibold">Send reset link</button>
  </form>
</div>{% endblock %}

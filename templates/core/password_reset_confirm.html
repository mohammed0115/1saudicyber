{% extends "base.html" %}{% block title %}Set New Password{% endblock %}
{% block content %}<div class="max-w-sm mx-auto bg-white rounded-xl p-6 shadow-sm border border-gov-gray-100 space-y-4">
{% if validlink %}<h1 class="text-xl font-bold text-gov-green-800">Set a new password</h1>
<form method="post" class="space-y-3">{% csrf_token %}{{ form.as_p }}
<button class="w-full bg-gov-green-800 text-white rounded-lg py-2 font-semibold">Change password</button></form>
{% else %}<p class="text-red-600">This reset link is invalid or expired.</p>{% endif %}</div>{% endblock %}
